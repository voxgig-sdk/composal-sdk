$kind: http-request
id: e3c456e8-50e2-5bd7-ac41-8740002d68c9
description: |-
  The `load` operation of **release_rollout**.

  SDK: `client.ReleaseRollout().load({ id: "example_id", release_id: "example" })`
url: "{{base}}/api/v1/execution/releases/:release_id/rollouts/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: release_id
    value: "{{release_id}}"
    description: "Input: release_id."
  - key: id
    value: "{{release_rollout_ref01}}"
    description: The release_rollout this request addresses.
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","release_id","release_rollout_ref01"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("3. Load release_rollout: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      if ("Mark01-release_rollout_ref01" === pm.variables.get("release_rollout_ref01_marked")) pm.test("3. Load release_rollout: the update reads back", () => {
        pm.expect(JSON.stringify(body)).to.include("Mark01-release_rollout_ref01")
      })
      pm.test("3. Load release_rollout: the record is the one asked for", () => {
        pm.expect(String(at(body, "id"))).to.eql(String(pm.variables.get("release_rollout_ref01")))
      })
    language: text/javascript
order: 3000
