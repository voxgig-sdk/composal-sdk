$kind: http-request
id: "5758dcef-d7df-599f-9872-842688372046"
description: |-
  The `load` operation of **connection_request**.

  SDK: `client.ConnectionRequest().load({ agent_id: "example", id: "example_id", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/relay/connections/requests/:request_key"
method: GET
headers:
  Accept: application/json
  X-Composal-Relay-Scope: "{{x_composal_relay_scope}}"
  X-Composal-Requester-Id: "{{x_composal_requester_id}}"
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this connection_request belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this connection_request belongs to.
  - key: request_key
    value: "{{connection_request_id}}"
    description: The connection_request this request addresses.
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","organization_id","agent_id","connection_request_id","x_composal_relay_scope","x_composal_requester_id"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("1. Load connection_request: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      if ("Mark01-connection_request_ref01" === pm.variables.get("connection_request_ref01_marked")) pm.test("1. Load connection_request: the update reads back", () => {
        pm.expect(JSON.stringify(body?.["connection"])).to.include("Mark01-connection_request_ref01")
      })
      pm.test("1. Load connection_request: the record is the one asked for", () => {
        pm.expect(String(at(body?.["connection"], "id"))).to.eql(String(pm.variables.get("connection_request_id")))
      })
    language: text/javascript
order: 1000
