$kind: http-request
id: "89c6afac-6a00-58fc-b0e1-1e259e6da7e5"
description: |-
  The `load` operation of **repository_access_resolve**.

  SDK: `client.RepositoryAccessResolve().load({ id: "example_id", resolve_id: "example" })`
url: "{{base}}/api/v1/repository_access/resolve/:org_slug/:repo_slug"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{repository_access_resolve_resolve_id}}"
    description: The repository_access_resolve this request addresses.
  - key: repo_slug
    value: "{{repository_access_resolve_id}}"
    description: The repository_access_resolve this request addresses.
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","repository_access_resolve_resolve_id","repository_access_resolve_id"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("1. Load repository_access_resolve: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      if ("Mark01-repository_access_resolve_ref01" === pm.variables.get("repository_access_resolve_ref01_marked")) pm.test("1. Load repository_access_resolve: the update reads back", () => {
        pm.expect(JSON.stringify(body?.["repository"])).to.include("Mark01-repository_access_resolve_ref01")
      })
      pm.test("1. Load repository_access_resolve: the record is the one asked for", () => {
        pm.expect(String(at(body?.["repository"], "resolve_id")) + "/" + String(at(body?.["repository"], "id"))).to.eql(String(pm.variables.get("repository_access_resolve_resolve_id")) + "/" + String(pm.variables.get("repository_access_resolve_id")))
      })
    language: text/javascript
order: 1000
