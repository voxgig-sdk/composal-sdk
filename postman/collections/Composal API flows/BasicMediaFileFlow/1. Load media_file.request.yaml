$kind: http-request
id: e219a26f-21b3-5da6-b81c-414326cfe195
description: |-
  The `load` operation of **media_file**.

  SDK: `client.MediaFile().load({ browser_session_id: "example", id: "example_id", media_id: "example", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/browser_sessions/:browser_session_id/media/:id/files/:file_id"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: inline
    value: "false"
    disabled: true
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this media_file belongs to.
  - key: browser_session_id
    value: "{{browser_session_id}}"
    description: The browser_session this media_file belongs to.
  - key: id
    value: "{{media_id}}"
    description: "Input: media_id."
  - key: file_id
    value: "{{media_file_id}}"
    description: The media_file this request addresses.
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","organization_id","browser_session_id","media_id","media_file_id"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("1. Load media_file: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      if ("Mark01-media_file_ref01" === pm.variables.get("media_file_ref01_marked")) pm.test("1. Load media_file: the update reads back", () => {
        pm.expect(JSON.stringify(body)).to.include("Mark01-media_file_ref01")
      })
      pm.test("1. Load media_file: the record is the one asked for", () => {
        pm.expect(String(at(body, "id"))).to.eql(String(pm.variables.get("media_file_id")))
      })
    language: text/javascript
order: 1000
