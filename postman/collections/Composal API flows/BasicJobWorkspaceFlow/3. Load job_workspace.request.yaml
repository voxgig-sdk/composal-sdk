$kind: http-request
id: "28220a3e-d263-5732-a4c9-c7d8cebdd4aa"
description: |-
  The `load` operation of **job_workspace**.

  SDK: `client.JobWorkspace().load({ job_id: "example", pipeline_id: "example", run_id: "example" })`
url: "{{base}}/api/v1/ci/pipelines/:pipeline_id/runs/:run_id/jobs/:job_id/workspaces"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: pipeline_id
    value: "{{pipeline_id}}"
    description: "Input: pipeline_id."
  - key: run_id
    value: "{{run_id}}"
    description: "Input: run_id."
  - key: job_id
    value: "{{job_id}}"
    description: "Input: job_id."
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","pipeline_id","run_id","job_id"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("3. Load job_workspace: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      if ("Mark01-job_workspace_ref01" === pm.variables.get("job_workspace_ref01_marked")) pm.test("3. Load job_workspace: the update reads back", () => {
        pm.expect(JSON.stringify(body)).to.include("Mark01-job_workspace_ref01")
      })
      pm.test("3. Load job_workspace: the record is the one asked for", () => {
        pm.expect(String(at(body, "id"))).to.eql(String(pm.variables.get("job_workspace_ref01")))
      })
    language: text/javascript
order: 3000
