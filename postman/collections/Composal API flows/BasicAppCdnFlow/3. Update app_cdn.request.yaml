$kind: http-request
id: "381b2672-8ef6-53d1-b66b-52a55ecd8cd7"
description: |-
  The `update` operation of **app_cdn**.

  SDK: `client.AppCdn().update({ app_id: "example", id: "example", app_environment_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/cdns/:id"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_cdn belongs to.
  - key: id
    value: "{{app_cdn_ref01}}"
    description: The app_cdn this request addresses.
body:
  type: json
  content: |-
    {
      "app_environment_id": "Mark01-app_cdn_ref01",
      "app_service_id": "{{app_service_id}}",
      "slug": "example",
      "name": "example",
      "distribution_kind": "pull_zone",
      "status": "draft",
      "origin_url": "https://example.com",
      "cache_path_prefix": "example",
      "cache_settings_json": "example",
      "security_settings_json": "example",
      "routing_settings_json": "example"
    }
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","app_id","app_cdn_ref01","app_environment_id","app_service_id"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("3. Update app_cdn: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      pm.test("3. Update app_cdn: the record is the one asked for", () => {
        pm.expect(String(at(body?.["cdn"], "id"))).to.eql(String(pm.variables.get("app_cdn_ref01")))
      })
      if (pm.response.code < 300) pm.variables.set("app_cdn_ref01_marked", "Mark01-app_cdn_ref01")
    language: text/javascript
order: 3000
