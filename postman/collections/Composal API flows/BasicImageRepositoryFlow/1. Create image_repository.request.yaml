  SDK: `client.ImageRepository().create({ organization_id: "example", name: "example", slug: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/image_repositories"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this image_repository belongs to.
body:
