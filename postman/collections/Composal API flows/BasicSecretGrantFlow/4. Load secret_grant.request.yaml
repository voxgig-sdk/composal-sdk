$kind: http-request
id: e2833e30-2235-5fd4-93cf-17e22f1d7cbb
description: |-
  The `load` operation of **secret_grant**.

  SDK: `client.SecretGrant().load({ id: "example_id", organization_id: "example", secret_id: "example" })`
url: "{{base}}/api/v1/identity/organizations/:organization_id/secrets/:secret_id/grants/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this secret_grant belongs to.
  - key: secret_id
    value: "{{secret_id}}"
    description: "Input: secret_id."
  - key: id
    value: "{{secret_grant_ref01}}"
    description: The secret_grant this request addresses.
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","organization_id","secret_id","secret_grant_ref01"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("4. Load secret_grant: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      if ("Mark01-secret_grant_ref01" === pm.variables.get("secret_grant_ref01_marked")) pm.test("4. Load secret_grant: the update reads back", () => {
        pm.expect(JSON.stringify(body)).to.include("Mark01-secret_grant_ref01")
      })
      pm.test("4. Load secret_grant: the record is the one asked for", () => {
        pm.expect(String(at(body, "id"))).to.eql(String(pm.variables.get("secret_grant_ref01")))
      })
    language: text/javascript
order: 4000
