$kind: http-request
id: "40070e57-94a1-56d8-8ba1-4b62ff8c6b3e"
description: |-
  The `update` operation of **agent_webhook**.

  SDK: `client.AgentWebhook().update({ agent_id: "example", id: "example", organization_id: "example", action: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/webhooks/:endpoint_id"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
  Idempotency-Key: "{{idempotency_key}}"
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_webhook belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this agent_webhook belongs to.
  - key: endpoint_id
    value: "{{agent_webhook_ref01}}"
    description: The agent_webhook this request addresses.
body:
  type: json
  content: |-
    {
      "action": "Mark01-agent_webhook_ref01",
      "expected_generation": 1
    }
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","organization_id","agent_id","agent_webhook_ref01","idempotency_key"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("2. Update agent_webhook: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      pm.test("2. Update agent_webhook: the record is the one asked for", () => {
        pm.expect(String(at(body, "id"))).to.eql(String(pm.variables.get("agent_webhook_ref01")))
      })
      if (pm.response.code < 300) pm.variables.set("agent_webhook_ref01_marked", "Mark01-agent_webhook_ref01")
    language: text/javascript
order: 2000
