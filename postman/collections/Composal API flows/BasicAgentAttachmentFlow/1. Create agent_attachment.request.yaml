$kind: http-request
id: "0a66e05d-db01-51e4-a900-b0aef913c7cb"
description: |-
  The `create` operation of **agent_attachment**.

  SDK: `client.AgentAttachment().create({ agent_id: "example", organization_id: "example", byte_size: 1, content_type: "example", file_name: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/attachments"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_attachment belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this agent_attachment belongs to.
body:
  type: json
  content: |-
    {
      "file_name": "example",
      "content_type": "example",
      "byte_size": 1
    }
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","organization_id","agent_id"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("1. Create agent_attachment: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const made = body
      pm.test("1. Create agent_attachment: the record carries its key", () => {
        pm.expect(made, "record").to.be.an("object")
        pm.expect(at(made, "id"), "id").to.exist
      })
      if (null != made && null != at(made, "id")) pm.variables.set("agent_attachment_ref01", String(at(made, "id")))
    language: text/javascript
order: 1000
