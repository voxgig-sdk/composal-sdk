$kind: http-request
id: "1a680233-9a3a-5b3c-817e-01f717e56a72"
description: |-
  The `update` operation of **site_secret**.

  SDK: `client.SiteSecret().update({ id: "example", organization_id: "example", site_id: "example", native_agent_id: "example" })`
url: "{{base}}/api/v1/spark/organizations/:organization_id/sites/:name/secrets/:secret_name"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this site_secret belongs to.
  - key: name
    value: "{{site_id}}"
    description: The site this site_secret belongs to.
  - key: secret_name
    value: "{{site_secret_id}}"
    description: The site_secret this request addresses.
body:
  type: json
  content: |-
    {
      "native_agent_id": "Mark01-site_secret_ref01",
      "value": "example"
    }
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","organization_id","site_id","site_secret_id"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("1. Update site_secret: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      pm.test("1. Update site_secret: the record is the one asked for", () => {
        pm.expect(String(at(body, "id"))).to.eql(String(pm.variables.get("site_secret_id")))
      })
      if (pm.response.code < 300) pm.variables.set("site_secret_ref01_marked", "Mark01-site_secret_ref01")
    language: text/javascript
order: 1000
