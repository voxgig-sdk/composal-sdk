$kind: http-request
id: "85a29bb6-0d2a-56b3-ae02-aaafde63020a"
description: |-
  The `list` operation of **app_service_placement**.

  SDK: `client.AppServicePlacement().list({ app_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/service_placements"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: existing
    value: ""
    disabled: true
  - key: service
    value: ""
    disabled: true
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_service_placement belongs to.
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","app_id"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("1. List app_service_placements: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const recs = body?.["placements"] || []
      const keys = Array.isArray(recs) ? recs.map((rec) => String(at(rec, "id"))) : []
      if (null == pm.variables.get("app_service_placement_ref01") && (true || "true" === String(pm.variables.get("getonly")).toLowerCase())) {
        if (Array.isArray(recs) && null != recs[0]) {
          pm.variables.set("app_service_placement_ref01", String(at(recs[0], "id")))
        }
        else if (pm.response.code < 300) {
          pm.variables.set("app_service_placement_ref01__empty", "true")
        }
      }
      if (null != pm.variables.get("app_service_placement_ref01")) pm.test("1. List app_service_placements: the record is listed", () => {
        pm.expect(keys).to.include(String(pm.variables.get("app_service_placement_ref01")))
      })
    language: text/javascript
order: 1000
