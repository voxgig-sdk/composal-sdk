$kind: http-request
id: "5cd31b2e-733d-574e-8e2b-60c1bd8fc54e"
description: |-
  The `load` operation of **repo_agent_session**.

  SDK: `client.RepoAgentSession().load({ id: "example_id", organization_id: "example", repo_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/agent_sessions/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this repo_agent_session belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this repo_agent_session belongs to.
  - key: id
    value: "{{repo_agent_session_ref01}}"
    description: The repo_agent_session this request addresses.
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","organization_id","repo_id","repo_agent_session_ref01"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("4. Load repo_agent_session: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      if ("Mark01-repo_agent_session_ref01" === pm.variables.get("repo_agent_session_ref01_marked")) pm.test("4. Load repo_agent_session: the update reads back", () => {
        pm.expect(JSON.stringify(body)).to.include("Mark01-repo_agent_session_ref01")
      })
      pm.test("4. Load repo_agent_session: the record is the one asked for", () => {
        pm.expect(String(at(body, "id"))).to.eql(String(pm.variables.get("repo_agent_session_ref01")))
      })
    language: text/javascript
order: 4000
