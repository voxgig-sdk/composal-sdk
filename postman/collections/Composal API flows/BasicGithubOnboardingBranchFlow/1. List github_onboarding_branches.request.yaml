$kind: http-request
id: "35986b1e-111d-5be0-a92c-7b42acb71c8f"
description: |-
  The `list` operation of **github_onboarding_branch**.

  SDK: `client.GithubOnboardingBranch().list({ organization_id: "example", github_app_installation_id: "example", name: "example", owner: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/github_onboarding/branches?github_app_installation_id={{github_app_installation_id}}&name={{name}}&owner={{owner}}"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: github_app_installation_id
    value: "{{github_app_installation_id}}"
  - key: name
    value: "{{name}}"
  - key: owner
    value: "{{owner}}"
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this github_onboarding_branch belongs to.
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","github_app_installation_id","name","owner","organization_id"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("1. List github_onboarding_branches: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const recs = body?.["branches"] || []
      const keys = Array.isArray(recs) ? recs.map((rec) => String(at(rec, "id"))) : []
      if (null == pm.variables.get("github_onboarding_branch_ref01") && (true || "true" === String(pm.variables.get("getonly")).toLowerCase())) {
        if (Array.isArray(recs) && null != recs[0]) {
          pm.variables.set("github_onboarding_branch_ref01", String(at(recs[0], "id")))
        }
        else if (pm.response.code < 300) {
          pm.variables.set("github_onboarding_branch_ref01__empty", "true")
        }
      }
      if (null != pm.variables.get("github_onboarding_branch_ref01")) pm.test("1. List github_onboarding_branches: the record is listed", () => {
        pm.expect(keys).to.include(String(pm.variables.get("github_onboarding_branch_ref01")))
      })
    language: text/javascript
order: 1000
