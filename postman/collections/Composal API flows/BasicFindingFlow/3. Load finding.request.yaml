$kind: http-request
id: "19124fdc-bd23-5347-9c1e-a76989e13bc9"
description: |-
  The `load` operation of **finding**.

  SDK: `client.Finding().load({ id: "example_id", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/verify/findings/:id"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: repository_id
    value: ""
    disabled: true
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this finding belongs to.
  - key: id
    value: "{{finding_ref01}}"
    description: The finding this request addresses.
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","organization_id","finding_ref01"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("3. Load finding: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      if ("Mark01-finding_ref01" === pm.variables.get("finding_ref01_marked")) pm.test("3. Load finding: the update reads back", () => {
        pm.expect(JSON.stringify(body?.["finding"])).to.include("Mark01-finding_ref01")
      })
      pm.test("3. Load finding: the record is the one asked for", () => {
        pm.expect(String(at(body?.["finding"], "id"))).to.eql(String(pm.variables.get("finding_ref01")))
      })
    language: text/javascript
order: 3000
