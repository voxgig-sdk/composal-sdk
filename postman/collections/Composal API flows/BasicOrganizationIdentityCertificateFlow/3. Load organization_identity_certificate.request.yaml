$kind: http-request
id: "431cda7f-f104-57c4-83a3-f06650e10da3"
description: |-
  The `load` operation of **organization_identity_certificate**.

  SDK: `client.OrganizationIdentityCertificate().load({ organization_id: "example" })`
url: "{{base}}/api/v1/identity/organizations/:organization_id/identity_certificates/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this organization_identity_certificate belongs to.
  - key: id
    value: "{{organization_identity_certificate_ref01}}"
    description: The organization_identity_certificate this request addresses.
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","organization_id","organization_identity_certificate_ref01"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("3. Load organization_identity_certificate: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      if ("Mark01-organization_identity_certificate_ref01" === pm.variables.get("organization_identity_certificate_ref01_marked")) pm.test("3. Load organization_identity_certificate: the update reads back", () => {
        pm.expect(JSON.stringify(body)).to.include("Mark01-organization_identity_certificate_ref01")
      })
      pm.test("3. Load organization_identity_certificate: the record is the one asked for", () => {
        pm.expect(String(at(body, "id"))).to.eql(String(pm.variables.get("organization_identity_certificate_ref01")))
      })
    language: text/javascript
order: 3000
