$kind: http-request
id: "6b26a4fa-8a4c-5d73-b0a6-65ce3b6ea82d"
description: |-
  The `update` operation of **attachment_part**.

  SDK: `client.AttachmentPart().update({ agent_id: "example", attachment_id: "example", id: "example", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/attachments/:attachment_id/parts/:index"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this attachment_part belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this attachment_part belongs to.
  - key: attachment_id
    value: "{{attachment_id}}"
    description: "Input: attachment_id."
  - key: index
    value: "{{attachment_part_id}}"
    description: The attachment_part this request addresses.
body:
  type: json
  content: "{}"
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","organization_id","agent_id","attachment_id","attachment_part_id"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("1. Update attachment_part: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      pm.test("1. Update attachment_part: the record is the one asked for", () => {
        pm.expect(String(at(body, "id"))).to.eql(String(pm.variables.get("attachment_part_id")))
      })
      if (pm.response.code < 300) pm.variables.set("attachment_part_ref01_marked", "Mark01-attachment_part_ref01")
    language: text/javascript
order: 1000
