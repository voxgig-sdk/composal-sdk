$kind: http-request
id: "4bfdf187-8942-587f-9703-ca7d78425e7e"
description: |-
  The `load` operation of **spark_credit_agent_usage**.

  SDK: `client.SparkCreditAgentUsage().load({ id: "example_id", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/spark_credits/agent_usage/:agent_id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this spark_credit_agent_usage belongs to.
  - key: agent_id
    value: "{{spark_credit_agent_usage_id}}"
    description: The spark_credit_agent_usage this request addresses.
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","organization_id","spark_credit_agent_usage_id"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("1. Load spark_credit_agent_usage: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      if ("Mark01-spark_credit_agent_usage_ref01" === pm.variables.get("spark_credit_agent_usage_ref01_marked")) pm.test("1. Load spark_credit_agent_usage: the update reads back", () => {
        pm.expect(JSON.stringify(body)).to.include("Mark01-spark_credit_agent_usage_ref01")
      })
      pm.test("1. Load spark_credit_agent_usage: the record is the one asked for", () => {
        pm.expect(String(at(body, "id"))).to.eql(String(pm.variables.get("spark_credit_agent_usage_id")))
      })
    language: text/javascript
order: 1000
