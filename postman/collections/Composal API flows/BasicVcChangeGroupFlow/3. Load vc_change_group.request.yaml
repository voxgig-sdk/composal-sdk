$kind: http-request
id: b5a485df-947b-5fc2-9fc2-7bbb769fcea7
description: |-
  The `load` operation of **vc_change_group**.

  SDK: `client.VcChangeGroup().load({ id: "example_id", organization_id: "example", repo_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/vcs/change_groups/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this vc_change_group belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this vc_change_group belongs to.
  - key: id
    value: "{{vc_change_group_ref01}}"
    description: The vc_change_group this request addresses.
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","organization_id","repo_id","vc_change_group_ref01"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("3. Load vc_change_group: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      if ("Mark01-vc_change_group_ref01" === pm.variables.get("vc_change_group_ref01_marked")) pm.test("3. Load vc_change_group: the update reads back", () => {
        pm.expect(JSON.stringify(body?.["group"])).to.include("Mark01-vc_change_group_ref01")
      })
      pm.test("3. Load vc_change_group: the record is the one asked for", () => {
        pm.expect(String(at(body?.["group"], "id"))).to.eql(String(pm.variables.get("vc_change_group_ref01")))
      })
    language: text/javascript
order: 3000
