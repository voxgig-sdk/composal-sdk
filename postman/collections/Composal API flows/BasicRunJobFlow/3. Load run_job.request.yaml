$kind: http-request
id: "68a739d4-9ee2-54fb-a8a7-1c260360d6ec"
description: |-
  The `load` operation of **run_job**.

  SDK: `client.RunJob().load({ id: "example_id", pipeline_id: "example", run_id: "example" })`
url: "{{base}}/api/v1/ci/pipelines/:pipeline_id/runs/:run_id/jobs/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: pipeline_id
    value: "{{pipeline_id}}"
    description: "Input: pipeline_id."
  - key: run_id
    value: "{{run_id}}"
    description: "Input: run_id."
  - key: id
    value: "{{run_job_ref01}}"
    description: The run_job this request addresses.
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","pipeline_id","run_id","run_job_ref01"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("3. Load run_job: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      if ("Mark01-run_job_ref01" === pm.variables.get("run_job_ref01_marked")) pm.test("3. Load run_job: the update reads back", () => {
        pm.expect(JSON.stringify(body?.["job"])).to.include("Mark01-run_job_ref01")
      })
      pm.test("3. Load run_job: the record is the one asked for", () => {
        pm.expect(String(at(body?.["job"], "id"))).to.eql(String(pm.variables.get("run_job_ref01")))
      })
    language: text/javascript
order: 3000
