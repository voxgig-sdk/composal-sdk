$kind: http-request
id: "409f5c4b-c7f3-5d5a-a053-13b9364b4b9c"
description: |-
  The `load` operation of **github_integration**.

  SDK: `client.GithubIntegration().load({ id: "example_id", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/pages/github_integrations/:github_app_installation_id"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: page
    value: ""
    disabled: true
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this github_integration belongs to.
  - key: github_app_installation_id
    value: "{{github_integration_ref01}}"
    description: The github_integration this request addresses.
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","organization_id","github_integration_ref01"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("2. Load github_integration: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      if ("Mark01-github_integration_ref01" === pm.variables.get("github_integration_ref01_marked")) pm.test("2. Load github_integration: the update reads back", () => {
        pm.expect(JSON.stringify(body?.["organization"])).to.include("Mark01-github_integration_ref01")
      })
      pm.test("2. Load github_integration: the record is the one asked for", () => {
        pm.expect(String(at(body?.["organization"], "id"))).to.eql(String(pm.variables.get("github_integration_ref01")))
      })
    language: text/javascript
order: 2000
