$kind: http-request
id: a0375d41-c75d-5524-9fb8-58662d9f0981
description: |-
  The `list` operation of **vc_file**.

  SDK: `client.VcFile().list({ organization_id: "example", repo_id: "example", ref: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/vcs/files?ref={{ref}}"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: prefix
    value: ""
    disabled: true
  - key: ref
    value: "{{ref}}"
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this vc_file belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this vc_file belongs to.
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","ref","organization_id","repo_id"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("1. List vc_files: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const recs = body?.["paths"] || []
      const keys = Array.isArray(recs) ? recs.map((rec) => String(at(rec, "id"))) : []
      if (null == pm.variables.get("vc_file_ref01") && (true || "true" === String(pm.variables.get("getonly")).toLowerCase())) {
        if (Array.isArray(recs) && null != recs[0]) {
          pm.variables.set("vc_file_ref01", String(at(recs[0], "id")))
        }
        else if (pm.response.code < 300) {
          pm.variables.set("vc_file_ref01__empty", "true")
        }
      }
      if (null != pm.variables.get("vc_file_ref01")) pm.test("1. List vc_files: the record is listed", () => {
        pm.expect(keys).to.include(String(pm.variables.get("vc_file_ref01")))
      })
    language: text/javascript
order: 1000
