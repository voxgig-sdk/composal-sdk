$kind: http-request
id: "7e16ae74-d99c-50c6-a05b-61c148df0a23"
description: |-
  The `remove` operation of **agent_manager**.

  SDK: `client.AgentManager().remove({ agent_id: "example", id: "example_id", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/managers/:user_id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_manager belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this agent_manager belongs to.
  - key: user_id
    value: "{{agent_manager_ref01}}"
    description: The agent_manager this request addresses.
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","organization_id","agent_id","agent_manager_ref01"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("2. Remove agent_manager: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      if (pm.response.code < 300) {
        pm.variables.set("agent_manager_ref01_removed", String(pm.variables.get("agent_manager_ref01")))
        pm.variables.unset("agent_manager_ref01")
      }
    language: text/javascript
order: 2000
