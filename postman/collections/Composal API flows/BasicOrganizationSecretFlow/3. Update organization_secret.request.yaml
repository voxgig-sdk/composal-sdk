$kind: http-request
id: "81e0e244-33c6-5b7c-b724-9d2b6f333de4"
description: |-
  The `update` operation of **organization_secret**.

  SDK: `client.OrganizationSecret().update({ id: "example", organization_id: "example" })`
url: "{{base}}/api/v1/identity/organizations/:organization_id/secrets/:id"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this organization_secret belongs to.
  - key: id
    value: "{{organization_secret_ref01}}"
    description: The organization_secret this request addresses.
body:
  type: json
  content: |-
    {
      "app_environment_id": "Mark01-organization_secret_ref01"
    }
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","organization_id","organization_secret_ref01"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("3. Update organization_secret: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      pm.test("3. Update organization_secret: the record is the one asked for", () => {
        pm.expect(String(at(body, "id"))).to.eql(String(pm.variables.get("organization_secret_ref01")))
      })
      if (pm.response.code < 300) pm.variables.set("organization_secret_ref01_marked", "Mark01-organization_secret_ref01")
    language: text/javascript
order: 3000
