$kind: http-request
id: c08a7ee2-c46f-591f-8bfa-0a2c3328b2c5
description: |-
  The `load` operation of **demo_share_segment**.

  SDK: `client.DemoShareSegment().load({ demo_share_id: "example", id: "example_id" })`
url: "{{base}}/api/v1/verify/demo_shares/:token/segments/:segment_id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: token
    value: "{{demo_share_id}}"
    description: The demo_share this demo_share_segment belongs to.
  - key: segment_id
    value: "{{demo_share_segment_id}}"
    description: The demo_share_segment this request addresses.
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","demo_share_id","demo_share_segment_id"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("1. Load demo_share_segment: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      if ("Mark01-demo_share_segment_ref01" === pm.variables.get("demo_share_segment_ref01_marked")) pm.test("1. Load demo_share_segment: the update reads back", () => {
        pm.expect(JSON.stringify(body)).to.include("Mark01-demo_share_segment_ref01")
      })
      pm.test("1. Load demo_share_segment: the record is the one asked for", () => {
        pm.expect(String(at(body, "id"))).to.eql(String(pm.variables.get("demo_share_segment_id")))
      })
    language: text/javascript
order: 1000
