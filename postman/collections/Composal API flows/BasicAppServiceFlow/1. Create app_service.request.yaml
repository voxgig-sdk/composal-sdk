$kind: http-request
id: fa1fbdfd-07ac-5ade-a440-8e995aabc750
description: |-
  The `create` operation of **app_service**.

  SDK: `client.AppService().create({ app_id: "example", auto_deploy: true, desired_instances: 1, kind: "example", name: "example", publicly_accessible: true, runtime: "example", runtime_adapter_kind: "example", slug: "example", source_path: "example", start_command: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/services"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
