$kind: http-request
id: "6a183be7-9957-59bd-a71c-dbe179d09d6f"
description: |-
  The `update` operation of **app_service**.

  SDK: `client.AppService().update({ app_id: "example", id: "example", auto_deploy: true })`
url: "{{base}}/api/v1/hosting/apps/:app_id/services/:id"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_service belongs to.
  - key: id
    value: "{{app_service_ref01}}"
    description: The app_service this request addresses.
body:
  type: json
  content: |-
    {
      "slug": "example",
      "name": "example",
      "kind": "web",
      "runtime": "docker",
      "runtime_adapter_kind": "nomad",
      "runtime_adapter_settings_json": "example",
      "nomad_namespace": "example",
      "nomad_region": "example",
      "cpu_mhz": 1,
      "memory_mb": 1,
      "memory_max_mb": 1,
      "disk_mb": 1,
      "nomad_constraints_json": "example",
      "nomad_update_strategy_json": "example",
      "nomad_ulimits_json": "example",
      "nomad_kill_timeout_seconds": 1,
      "nomad_shutdown_delay_seconds": 1,
      "source_path": "example",
      "build_command": "Mark01-app_service_ref01",
      "release_command": "example",
      "prestart_command": "example",
      "start_command": "example",
      "healthcheck_path": "example",
      "schedule": "example",
      "internal_port": 1,
      "desired_instances": 1,
      "publicly_accessible": true,
      "auto_deploy": true,
      "deploy_paths": [
        "example"
      ]
    }
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","app_id","app_service_ref01"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("3. Update app_service: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      pm.test("3. Update app_service: the record is the one asked for", () => {
        pm.expect(String(at(body?.["service"], "id"))).to.eql(String(pm.variables.get("app_service_ref01")))
      })
      if (pm.response.code < 300) pm.variables.set("app_service_ref01_marked", "Mark01-app_service_ref01")
    language: text/javascript
order: 3000
