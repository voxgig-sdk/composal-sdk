$kind: http-request
id: b1f77aa7-8936-5a6d-88bb-1ce9cbaa06f3
description: |-
  The `load` operation of **device_operation**.

  SDK: `client.DeviceOperation().load({ device_id: "example", id: "example_id", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/devices/:device_registration_id/control_operations/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this device_operation belongs to.
  - key: device_registration_id
    value: "{{device_id}}"
    description: The device this device_operation belongs to.
  - key: id
    value: "{{device_operation_ref01}}"
    description: The device_operation this request addresses.
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","organization_id","device_id","device_operation_ref01"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("2. Load device_operation: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      if ("Mark01-device_operation_ref01" === pm.variables.get("device_operation_ref01_marked")) pm.test("2. Load device_operation: the update reads back", () => {
        pm.expect(JSON.stringify(body?.["operation"])).to.include("Mark01-device_operation_ref01")
      })
      pm.test("2. Load device_operation: the record is the one asked for", () => {
        pm.expect(String(at(body?.["operation"], "id"))).to.eql(String(pm.variables.get("device_operation_ref01")))
      })
    language: text/javascript
order: 2000
