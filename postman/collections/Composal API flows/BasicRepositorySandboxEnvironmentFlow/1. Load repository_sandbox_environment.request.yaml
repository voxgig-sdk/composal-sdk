$kind: http-request
id: "28b6d8e3-bc3e-53c1-a22e-3f7ee00f96cb"
description: |-
  The `load` operation of **repository_sandbox_environment**.

  SDK: `client.RepositorySandboxEnvironment().load({ id: "example_id", repository_id: "example" })`
url: "{{base}}/api/v1/repositories/:repository/sandbox_environments/:profile"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: repository
    value: "{{repository_id}}"
    description: "Input: repository_id."
  - key: profile
    value: "{{repository_sandbox_environment_id}}"
    description: The repository_sandbox_environment this request addresses.
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","repository_id","repository_sandbox_environment_id"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("1. Load repository_sandbox_environment: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      if ("Mark01-repository_sandbox_environment_ref01" === pm.variables.get("repository_sandbox_environment_ref01_marked")) pm.test("1. Load repository_sandbox_environment: the update reads back", () => {
        pm.expect(JSON.stringify(body)).to.include("Mark01-repository_sandbox_environment_ref01")
      })
      pm.test("1. Load repository_sandbox_environment: the record is the one asked for", () => {
        pm.expect(String(at(body, "id"))).to.eql(String(pm.variables.get("repository_sandbox_environment_id")))
      })
    language: text/javascript
order: 1000
