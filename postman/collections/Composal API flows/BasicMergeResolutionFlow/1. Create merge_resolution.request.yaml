$kind: http-request
id: "6d457806-9f6d-5159-acc7-505b5cf0e801"
description: |-
  The `create` operation of **merge_resolution**.

  SDK: `client.MergeResolution().create({ base: "example", ours: "example", theirs: "example" })`
url: "{{base}}/api/v1/merge_resolutions"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "path": "example",
      "base": "example",
      "ours": "example",
      "theirs": "example",
      "context": {}
    }
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("1. Create merge_resolution: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const made = body
      pm.test("1. Create merge_resolution: the record carries its key", () => {
        pm.expect(made, "record").to.be.an("object")
        pm.expect(at(made, "id"), "id").to.exist
      })
      if (null != made && null != at(made, "id")) pm.variables.set("merge_resolution_ref01", String(at(made, "id")))
    language: text/javascript
order: 1000
