$kind: http-request
id: "855ea6ac-98df-5b26-9730-967df26272e6"
description: |-
  The `list` operation of **preview_sharing_approval**.

  SDK: `client.PreviewSharingApproval().list({ app_id: "example", preview_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/previews/:id/sharing_approvals"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this preview_sharing_approval belongs to.
  - key: id
    value: "{{preview_id}}"
    description: "Input: preview_id."
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","app_id","preview_id"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("2. List preview_sharing_approvals: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const recs = body || []
      const keys = Array.isArray(recs) ? recs.map((rec) => String(at(rec, "id"))) : []
      if (null == pm.variables.get("preview_sharing_approval_ref01") && (false || "true" === String(pm.variables.get("getonly")).toLowerCase())) {
        if (Array.isArray(recs) && null != recs[0]) {
          pm.variables.set("preview_sharing_approval_ref01", String(at(recs[0], "id")))
        }
        else if (pm.response.code < 300) {
          pm.variables.set("preview_sharing_approval_ref01__empty", "true")
        }
      }
      if (null != pm.variables.get("preview_sharing_approval_ref01")) pm.test("2. List preview_sharing_approvals: the record is listed", () => {
        pm.expect(keys).to.include(String(pm.variables.get("preview_sharing_approval_ref01")))
      })
    language: text/javascript
order: 2000
