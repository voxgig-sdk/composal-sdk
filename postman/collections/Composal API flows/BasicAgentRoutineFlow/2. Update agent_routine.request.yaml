$kind: http-request
id: "1343200f-4780-51b3-8c83-a958de064476"
description: |-
  The `update` operation of **agent_routine**.

  SDK: `client.AgentRoutine().update({ agent_id: "example", id: "example", organization_id: "example", enabled: true })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/routines/:routine_id"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_routine belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this agent_routine belongs to.
  - key: routine_id
    value: "{{agent_routine_ref01}}"
    description: The agent_routine this request addresses.
body:
  type: json
  content: |-
    {
      "enabled": true,
      "description": "Mark01-agent_routine_ref01"
    }
scripts:
  - type: beforeRequest
    code: |-
      const given = (name) => { const v = pm.variables.get(name); return null != v && "" !== v }
      const flag = (name, dflt) => given(name) ? "true" === String(pm.variables.get(name)).toLowerCase() : dflt
      const getonly = flag("getonly", false)
      const missing = ["base","organization_id","agent_id","agent_routine_ref01"].filter((name) => !given(name))
      if (!given("apikey")) missing.unshift("apikey")
      const empty = 0 < missing.length && missing.every((name) => given(name + "__empty"))
      if (getonly && "GET" !== pm.request.method) {
        console.log("excluded (getonly): " + pm.info.requestName)
        pm.execution.skipRequest()
      }
      else if (empty) {
        console.log("skipped: " + pm.info.requestName + " has no record to read: the list was empty")
        pm.execution.skipRequest()
      }
      else if (0 < missing.length) {
        const why = pm.info.requestName + " needs " + missing.join(", ") + ", which no earlier step or variable gave"
        if (getonly || !flag("strict", true)) console.log((getonly ? "excluded (getonly): " : "blocked: ") + why)
        else pm.test("blocked: " + why, () => { throw new Error("blocked") })
        pm.execution.skipRequest()
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("2. Update agent_routine: succeeds", () => {
        pm.expect(pm.response.code, "status").to.be.within(200, 299)
      })
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      pm.test("2. Update agent_routine: the record is the one asked for", () => {
        pm.expect(String(at(body, "id"))).to.eql(String(pm.variables.get("agent_routine_ref01")))
      })
      if (pm.response.code < 300) pm.variables.set("agent_routine_ref01_marked", "Mark01-agent_routine_ref01")
    language: text/javascript
order: 2000
