$kind: http-request
id: "28bc7f2e-deca-5c6d-ad45-5feb3d39917f"
description: |-
  The `load` operation of **relay_agent_connection**.

  SDK: `client.RelayAgentConnection().load({ agent_id: "example", id: "example_id", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/relay/connections/:connection_id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
