$kind: http-request
id: "415dedb7-3cd4-5230-9c6b-d32625084e08"
description: |-
  The `list` operation of **pairing_event**.

  SDK: `client.PairingEvent().list({ pairing_id: "example" })`
url: "{{base}}/api/v1/relay/pairings/:id/events"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "{{pairing_id}}"
    description: The pairing this pairing_event belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("pairing_event_id")) pm.collectionVariables.set("pairing_event_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
