$kind: http-request
id: d996941b-d70a-554c-9bc9-a9e51459dee4
description: |-
  The `list` operation of **change_reviewer**.

  SDK: `client.ChangeReviewer().list({ change_id: "example", organization_id: "example", repo_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/vcs/changes/:id/reviewers"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this change_reviewer belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this change_reviewer belongs to.
  - key: id
    value: "{{change_id}}"
    description: The change this change_reviewer belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["reviewers"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("change_reviewer_id")) pm.collectionVariables.set("change_reviewer_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
