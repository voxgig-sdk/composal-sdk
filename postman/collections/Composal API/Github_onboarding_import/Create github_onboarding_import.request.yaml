$kind: http-request
id: "85696e11-e0a8-5b6a-ad9d-7cd4498878e9"
description: |-
  The `create` operation of **github_onboarding_import**.

  SDK: `client.GithubOnboardingImport().create({ organization_id: "example", github_app_installation_id: "example", repositories: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/github_onboarding/imports"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this github_onboarding_import belongs to.
body:
  type: json
  content: |-
    {
      "github_app_installation_id": "{{github_app_installation_id}}",
      "repositories": "all"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["batch"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("github_onboarding_import_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
