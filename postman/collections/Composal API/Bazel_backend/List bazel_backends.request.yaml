$kind: http-request
id: "2d97e6b5-09d2-5052-aa66-4ab62219712c"
description: |-
  The `list` operation of **bazel_backend**.

  SDK: `client.BazelBackend().list()`
url: "{{base}}/api/v1/bazel/backends"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("bazel_backend_id")) pm.collectionVariables.set("bazel_backend_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
