$kind: http-request
id: "5e9acdde-895b-5ac9-a1e4-d0806df00f44"
description: |-
  The `remove` operation of **change_group_member**.

  SDK: `client.ChangeGroupMember().remove({ change_group_id: "example", id: "example_id", organization_id: "example", repo_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/vcs/change_groups/:id/members/:change_id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this change_group_member belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this change_group_member belongs to.
  - key: id
    value: "{{change_group_id}}"
    description: "Input: change_group_id."
  - key: change_id
    value: "{{change_group_member_id}}"
    description: The change_group_member this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("change_group_member_id")
      }
    language: text/javascript
order: 2000
