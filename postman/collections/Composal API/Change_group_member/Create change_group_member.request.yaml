$kind: http-request
id: "8ddb7cb1-2151-5f49-91f4-3e6e072d7274"
description: |-
  The `create` operation of **change_group_member**.

  SDK: `client.ChangeGroupMember().create({ change_group_id: "example", organization_id: "example", repo_id: "example", change_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/vcs/change_groups/:id/members"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this change_group_member belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this change_group_member belongs to.
  - key: id
    value: "{{change_group_id}}"
    description: "Input: change_group_id."
body:
  type: json
  content: |-
    {
      "change_id": "{{change_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["group"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("change_group_member_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
