$kind: http-request
id: "606489d4-ad72-5976-b952-073ed92a3646"
description: |-
  The `list` operation of **spark_agent_thread**.

  SDK: `client.SparkAgentThread().list({ agent_id: "example", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/threads"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: archived
    value: exclude
    disabled: true
  - key: conversation_id
    value: ""
    disabled: true
  - key: cursor
    value: ""
    disabled: true
  - key: local_cursor
    value: ""
    disabled: true
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this spark_agent_thread belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this spark_agent_thread belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["threads"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("spark_agent_thread_id")) pm.collectionVariables.set("spark_agent_thread_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
