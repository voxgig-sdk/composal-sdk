id: e35fd50f-5585-5eb0-b8dc-39646dbaf170
description: |-
  The `list` operation of **artefact**.

  SDK: `client.Artefact().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/artefacts"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: author
    value: ""
