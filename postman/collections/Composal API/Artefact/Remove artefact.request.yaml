$kind: http-request
id: "9491d903-eb4e-52d4-81cb-fc7f0970cf8b"
description: |-
  The `remove` operation of **artefact**.

  SDK: `client.Artefact().remove({ id: "example_id", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/artefacts/:artefact_ref"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this artefact belongs to.
  - key: artefact_ref
    value: "{{artefact_id}}"
    description: The artefact this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("artefact_id")
      }
    language: text/javascript
order: 8000
