$kind: http-request
id: "1ed7ec98-3c78-5ea3-9fa3-a21d29d4a8e1"
description: |-
  The `create` operation of **artefact**.

  SDK: `client.Artefact().create({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/artefacts"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this artefact belongs to.
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("artefact_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
