$kind: http-request
id: "4db781e4-1169-5eab-b1e3-396fde7138dc"
description: |-
  The `list` operation of **vcs_setting**.

  SDK: `client.VcsSetting().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/pages/vcs_settings"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this vcs_setting belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("vcs_setting_id")) pm.collectionVariables.set("vcs_setting_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
