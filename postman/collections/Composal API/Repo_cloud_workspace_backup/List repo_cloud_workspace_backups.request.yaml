$kind: http-request
id: "8cccc50f-089e-5265-8fe5-2e7bcd163702"
description: |-
  The `list` operation of **repo_cloud_workspace_backup**.

  SDK: `client.RepoCloudWorkspaceBackup().list({ organization_id: "example", repo_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/cloud_workspace_backups"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this repo_cloud_workspace_backup belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this repo_cloud_workspace_backup belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("repo_cloud_workspace_backup_id")) pm.collectionVariables.set("repo_cloud_workspace_backup_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
