$kind: http-request
id: "405dbce0-046d-5c15-b74d-39164b9dd26c"
description: |-
  The `list` operation of **pages_member**.

  SDK: `client.PagesMember().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/pages/members"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this pages_member belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["invitations"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("pages_member_id")) pm.collectionVariables.set("pages_member_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
