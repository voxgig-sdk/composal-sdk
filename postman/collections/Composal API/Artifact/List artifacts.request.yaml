$kind: http-request
id: "366d9bdf-c91a-5465-be1e-7b3f4cd3bb01"
description: |-
  The `list` operation of **artifact**.

  SDK: `client.Artifact().list()`
url: "{{base}}/api/v1/artifacts/artifacts"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("artifact_id")) pm.collectionVariables.set("artifact_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
