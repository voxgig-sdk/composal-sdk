$kind: http-request
id: fe5c136f-5b0f-50a6-8638-d7c5b2a5407b
description: |-
  The `list` operation of **label**.

  SDK: `client.Label().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/labels"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: include_unused
    value: "false"
    disabled: true
  - key: limit
    value: "50"
    disabled: true
  - key: q
    value: ""
    disabled: true
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this label belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["labels"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("label_id")) pm.collectionVariables.set("label_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
