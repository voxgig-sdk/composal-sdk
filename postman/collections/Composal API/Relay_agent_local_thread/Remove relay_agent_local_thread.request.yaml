$kind: http-request
id: "5fd46678-6d12-5681-8bc4-766dc24fb407"
description: |-
  The `remove` operation of **relay_agent_local_thread**.

  SDK: `client.RelayAgentLocalThread().remove({ agent_id: "example", id: "example_id", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/local_threads/:local_thread_id/relay"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this relay_agent_local_thread belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this relay_agent_local_thread belongs to.
  - key: local_thread_id
    value: "{{relay_agent_local_thread_id}}"
    description: The relay_agent_local_thread this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("relay_agent_local_thread_id")
      }
    language: text/javascript
order: 1000
