$kind: http-request
id: "58013e7d-e787-5998-8de8-10f039377301"
description: |-
  The `list` operation of **deployment_preview**.

  SDK: `client.DeploymentPreview().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/pages/deployments/previews"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: app
    value: ""
    disabled: true
  - key: change
    value: ""
    disabled: true
  - key: expiry
    value: ""
    disabled: true
  - key: health
    value: ""
    disabled: true
  - key: owner
    value: ""
    disabled: true
  - key: page
    value: ""
    disabled: true
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this deployment_preview belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["previews"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("deployment_preview_id")) pm.collectionVariables.set("deployment_preview_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
