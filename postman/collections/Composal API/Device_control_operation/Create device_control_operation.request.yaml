$kind: http-request
id: "9fdb491b-06ff-5424-8db9-6bf60c7a4a0a"
description: |-
  The `create` operation of **device_control_operation**.

  SDK: `client.DeviceControlOperation().create({ device_id: "example", organization_id: "example", action: "example", arguments: {}, key: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/devices/:device_registration_id/control_operations"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this device_control_operation belongs to.
  - key: device_registration_id
    value: "{{device_id}}"
    description: The device this device_control_operation belongs to.
body:
  type: json
  content: |-
    {
      "key": "example",
      "action": "agents.list",
      "arguments": {
        "result_delivery": "notify"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["operation"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("device_control_operation_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 2000
