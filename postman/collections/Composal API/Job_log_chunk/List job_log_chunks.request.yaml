$kind: http-request
id: "2fcac55b-61d2-54c2-9a6f-7ec468e08ad2"
description: |-
  The `list` operation of **job_log_chunk**.

  SDK: `client.JobLogChunk().list({ job_id: "example", pipeline_id: "example", run_id: "example" })`
url: "{{base}}/api/v1/ci/pipelines/:pipeline_id/runs/:run_id/jobs/:job_id/log_chunks"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: after_sequence
    value: ""
    disabled: true
pathVariables:
  - key: pipeline_id
    value: "{{pipeline_id}}"
    description: "Input: pipeline_id."
  - key: run_id
    value: "{{run_id}}"
    description: "Input: run_id."
  - key: job_id
    value: "{{job_id}}"
    description: "Input: job_id."
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["log_chunks"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("job_log_chunk_id")) pm.collectionVariables.set("job_log_chunk_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
