$kind: http-request
id: "8b0044ca-21a4-5e90-8a24-12544a0080bf"
description: |-
  The `create` operation of **device_pairing**.

  SDK: `client.DevicePairing().create({ organization_id: "example", architecture: "example", channel: "example", name: "example", platform: "example", public_key: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/devices/pairings"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this device_pairing belongs to.
body:
  type: json
  content: |-
    {
      "name": "example",
      "platform": "darwin",
      "architecture": "arm64",
      "channel": "dev",
      "public_key": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("device_pairing_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
