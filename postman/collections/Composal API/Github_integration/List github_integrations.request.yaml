$kind: http-request
id: e2a727a1-11a6-5094-b39f-3a1e62a85972
description: |-
  The `list` operation of **github_integration**.

  SDK: `client.GithubIntegration().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/pages/github_integrations"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this github_integration belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["github_installations"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("github_integration_id")) pm.collectionVariables.set("github_integration_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
