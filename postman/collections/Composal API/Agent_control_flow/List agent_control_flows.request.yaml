$kind: http-request
id: "18007570-d600-58be-8c82-cb03aae8f9ec"
description: |-
  The `list` operation of **agent_control_flow**.

  SDK: `client.AgentControlFlow().list({ agent_id: "example", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/control_flows"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_control_flow belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this agent_control_flow belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["flows"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("agent_control_flow_id")) pm.collectionVariables.set("agent_control_flow_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
