$kind: http-request
id: b31ed188-d023-5352-9b81-9daad89998b4
description: |-
  The `create` operation of **verify_environment**.

  SDK: `client.VerifyEnvironment().create({ organization_id: "example", slug: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/verify/environments"
method: POST
headers:
  Accept: application/json
  Idempotency-Key: "{{idempotency_key}}"
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this verify_environment belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("verify_environment_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
