$kind: http-request
id: "5b2602a1-121e-5c62-8ee3-2720f788dcb0"
description: |-
  The `create` operation of **agent_attachment**.

  SDK: `client.AgentAttachment().create({ agent_id: "example", organization_id: "example", byte_size: 1, content_type: "example", file_name: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/attachments"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_attachment belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this agent_attachment belongs to.
body:
  type: json
  content: |-
    {
      "file_name": "example",
      "content_type": "example",
      "byte_size": 1
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("agent_attachment_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
