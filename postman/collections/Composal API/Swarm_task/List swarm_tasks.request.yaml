$kind: http-request
id: f3af1834-6003-5842-ad08-185ddd361ef3
description: |-
  The `list` operation of **swarm_task**.

  SDK: `client.SwarmTask().list({ swarm_id: "example" })`
url: "{{base}}/api/v1/agent/swarms/:swarm_id/tasks"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: swarm_id
    value: "{{swarm_id}}"
    description: "Input: swarm_id."
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["tasks"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("swarm_task_id")) pm.collectionVariables.set("swarm_task_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
