$kind: http-request
id: ccf00f5e-d5e7-5cd0-97eb-5f77691424bc
description: |-
  The `list` operation of **repo_setting**.

  SDK: `client.RepoSetting().list({ organization_id: "example", repo_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/settings"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this repo_setting belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this repo_setting belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["access_tokens"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("repo_setting_id")) pm.collectionVariables.set("repo_setting_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
