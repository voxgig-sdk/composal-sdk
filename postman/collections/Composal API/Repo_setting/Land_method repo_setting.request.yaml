  SDK: `client.RepoSetting().update({ "organization_id": "organization_id", "repo_id": "repo_id", $action: "land_method" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/settings/land_method"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
