$kind: http-request
id: "13a740b7-9eb8-5c41-ba48-fb0c5dabb7b5"
description: |-
  The `magic_merge` action of **repo_setting**, a route of its `update` operation.

  SDK: `client.RepoSetting().update({ "organization_id": "organization_id", "repo_id": "repo_id", $action: "magic_merge" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/settings/magic_merge"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this repo_setting belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this repo_setting belongs to.
body:
  type: json
  content: |-
    {
      "application_mode": "off"
    }
order: 4000
