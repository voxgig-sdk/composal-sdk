$kind: http-request
id: aa0277ea-1ac1-5066-a0f5-7daa66d8673a
description: |-
  The `list` operation of **agreement**.

  SDK: `client.Agreement().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/pages/agreements"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this agreement belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("agreement_id")) pm.collectionVariables.set("agreement_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
