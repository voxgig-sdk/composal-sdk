$kind: http-request
id: e52692ef-97e5-532e-acba-518357715c09
description: |-
  The `remove` operation of **organization_secret**.

  SDK: `client.OrganizationSecret().remove({ id: "example_id", organization_id: "example" })`
url: "{{base}}/api/v1/identity/organizations/:organization_id/secrets/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this organization_secret belongs to.
  - key: id
    value: "{{organization_secret_id}}"
    description: The organization_secret this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("organization_secret_id")
      }
    language: text/javascript
order: 12000
