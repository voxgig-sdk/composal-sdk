$kind: http-request
id: ac696d60-a935-593d-ac76-7ed10c76a592
description: |-
  The `list` operation of **organization_secret**.

  SDK: `client.OrganizationSecret().list({ organization_id: "example" })`
url: "{{base}}/api/v1/identity/organizations/:organization_id/secrets"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this organization_secret belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["secrets"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("organization_secret_id")) pm.collectionVariables.set("organization_secret_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
