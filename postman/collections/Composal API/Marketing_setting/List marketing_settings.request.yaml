$kind: http-request
id: "3b9dc6b0-004b-55e5-9899-ec1e3f701944"
description: |-
  The `list` operation of **marketing_setting**.

  SDK: `client.MarketingSetting().list()`
url: "{{base}}/api/v1/marketing_settings"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("marketing_setting_id")) pm.collectionVariables.set("marketing_setting_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
