$kind: http-request
id: "11f32d01-1935-5d73-8b2d-353ba6e6cfaf"
description: |-
  The `remove` operation of **preview_secret**.

  SDK: `client.PreviewSecret().remove({ app_id: "example", id: "example_id", preview_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/previews/:preview_id/secrets/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this preview_secret belongs to.
  - key: preview_id
    value: "{{preview_id}}"
    description: "Input: preview_id."
  - key: id
    value: "{{preview_secret_id}}"
    description: The preview_secret this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("preview_secret_id")
      }
    language: text/javascript
order: 3000
