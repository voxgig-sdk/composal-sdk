$kind: http-request
id: ba629086-4dbc-53d8-af7e-bb70cea27aa6
description: |-
  The `create` operation of **preview_secret**.

  SDK: `client.PreviewSecret().create({ app_id: "example", preview_id: "example", env_key: "example", name: "example", slug: "example", value: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/previews/:preview_id/secrets"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this preview_secret belongs to.
  - key: preview_id
    value: "{{preview_id}}"
    description: "Input: preview_id."
body:
  type: json
  content: |-
    {
      "name": "example",
      "slug": "example",
      "env_key": "example",
      "value": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("preview_secret_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
