$kind: http-request
id: "30f4d8a8-4fc2-54fb-9d62-514475a2a026"
description: |-
  The `list` operation of **setting**.

  SDK: `client.Setting().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/pages/settings"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this setting belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("setting_id")) pm.collectionVariables.set("setting_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
