$kind: http-request
id: fc7abd7e-7c74-55ca-bef0-959446f5cce4
description: |-
  The `list` operation of **repo_access_token**.

  SDK: `client.RepoAccessToken().list({ organization_id: "example", repo_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/access_tokens"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this repo_access_token belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this repo_access_token belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["access_tokens"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("repo_access_token_id")) pm.collectionVariables.set("repo_access_token_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
