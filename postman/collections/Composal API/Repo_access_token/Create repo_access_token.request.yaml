$kind: http-request
id: "6cce9824-707c-51cf-8061-c97a81cf3490"
description: |-
  The `create` operation of **repo_access_token**.

  SDK: `client.RepoAccessToken().create({ organization_id: "example", repo_id: "example", name: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/access_tokens"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this repo_access_token belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this repo_access_token belongs to.
body:
  type: json
  content: |-
    {
      "name": "example",
      "permission_level": "read_only",
      "credential_purpose": "git_remote_helper",
      "expires_in_days": 1
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("repo_access_token_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 2000
