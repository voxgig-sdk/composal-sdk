$kind: http-request
id: "2732b10c-bce7-5d95-aedf-279ce87d3c10"
description: |-
  The `list` operation of **preview_sharing_approval**.

  SDK: `client.PreviewSharingApproval().list({ app_id: "example", preview_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/previews/:id/sharing_approvals"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this preview_sharing_approval belongs to.
  - key: id
    value: "{{preview_id}}"
    description: "Input: preview_id."
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("preview_sharing_approval_id")) pm.collectionVariables.set("preview_sharing_approval_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
