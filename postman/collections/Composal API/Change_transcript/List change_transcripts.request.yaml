$kind: http-request
id: "9533a8d0-1bf1-503b-ba41-f012d11b29d2"
description: |-
  The `list` operation of **change_transcript**.

  SDK: `client.ChangeTranscript().list({ change_id: "example", organization_id: "example", repo_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/vcs/changes/:change_id/transcripts"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this change_transcript belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this change_transcript belongs to.
  - key: change_id
    value: "{{change_id}}"
    description: The change this change_transcript belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["transcripts"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("change_transcript_id")) pm.collectionVariables.set("change_transcript_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
