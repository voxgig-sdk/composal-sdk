$kind: http-request
id: e22eda97-924e-5b58-b7e9-511398e4f230
description: |-
  The `remove` operation of **space_policy**.

  SDK: `client.SpacePolicy().remove({ id: "example_id", space_id: "example" })`
url: "{{base}}/api/v1/networking/spaces/:space_id/policies/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: space_id
    value: "{{space_id}}"
    description: "Input: space_id."
  - key: id
    value: "{{space_policy_id}}"
    description: The space_policy this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("space_policy_id")
      }
    language: text/javascript
order: 9000
