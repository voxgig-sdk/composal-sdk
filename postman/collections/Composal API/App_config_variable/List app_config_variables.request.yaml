$kind: http-request
id: f26cef03-4175-5635-a32f-a69b91e1c8ee
description: |-
  The `list` operation of **app_config_variable**.

  SDK: `client.AppConfigVariable().list({ app_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/config_variables"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: app_environment_id
    value: ""
    disabled: true
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_config_variable belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("app_config_variable_id")) pm.collectionVariables.set("app_config_variable_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
