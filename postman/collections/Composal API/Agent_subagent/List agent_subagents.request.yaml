$kind: http-request
id: "4fcbff37-38a3-59d4-a9d3-bab98e4568ba"
description: |-
  The `list` operation of **agent_subagent**.

  SDK: `client.AgentSubagent().list({ agent_id: "example", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/subagents"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: conversation_id
    value: ""
    disabled: true
  - key: cursor
    value: ""
    disabled: true
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_subagent belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this agent_subagent belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["subagents"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("agent_subagent_id")) pm.collectionVariables.set("agent_subagent_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
