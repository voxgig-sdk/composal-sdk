$kind: http-request
id: cd6c8a7f-643d-50c7-b348-93c2d5c88d48
description: |-
  The `list` operation of **artifact_cache_namespace**.

  SDK: `client.ArtifactCacheNamespace().list()`
url: "{{base}}/api/v1/artifacts/cache_namespaces"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("artifact_cache_namespace_id")) pm.collectionVariables.set("artifact_cache_namespace_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
