$kind: http-request
id: "3618455d-4eff-5c9c-b04e-337e33e1a3ed"
description: |-
  The `list` operation of **node_lease**.

  SDK: `client.NodeLease().list({ node_id: "example" })`
url: "{{base}}/api/v1/ci/nodes/:id/leases"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "{{node_id}}"
    description: The node this node_lease belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("node_lease_id")) pm.collectionVariables.set("node_lease_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
