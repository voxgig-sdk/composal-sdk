$kind: http-request
id: "0f176033-23a3-52c2-ac43-5f3f9b55d415"
description: |-
  The `list` operation of **cdn_deployment**.

  SDK: `client.CdnDeployment().list({ app_id: "example", cdn_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/cdns/:cdn_id/deployments"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this cdn_deployment belongs to.
  - key: cdn_id
    value: "{{cdn_id}}"
    description: "Input: cdn_id."
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("cdn_deployment_id")) pm.collectionVariables.set("cdn_deployment_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
