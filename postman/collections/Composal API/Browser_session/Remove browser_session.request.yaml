$kind: http-request
id: "76efb1cc-b38f-5821-bf9f-96646de14700"
description: |-
  The `remove` operation of **browser_session**.

  SDK: `client.BrowserSession().remove({ id: "example_id", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/browser_sessions/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this browser_session belongs to.
  - key: id
    value: "{{browser_session_id}}"
    description: The browser_session this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("browser_session_id")
      }
    language: text/javascript
order: 5000
