$kind: http-request
id: cdb02961-cacd-5416-8bf4-f534cfcd5349
description: |-
  The `create` operation of **app_storage_resource**.

  SDK: `client.AppStorageResource().create({ app_id: "example", access_mode: "example", kind: "example", name: "example", provider: "example", slug: "example", status: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/storage_resources"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_storage_resource belongs to.
body:
  type: json
  content: |-
    {
      "app_environment_id": "{{app_environment_id}}",
      "location_id": "{{location_id}}",
      "slug": "example",
      "name": "example",
      "kind": "bucket",
      "provider": "s3",
      "region": "example",
      "access_mode": "private",
      "mount_path": "example",
      "capacity_gb": 1,
      "status": "provisioning"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["storage_resource"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("app_storage_resource_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
