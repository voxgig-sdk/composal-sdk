$kind: http-request
id: "4a6016fc-1fda-5ea5-b88f-696dbf1debd6"
description: |-
  The `list` operation of **app_storage_resource**.

  SDK: `client.AppStorageResource().list({ app_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/storage_resources"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_storage_resource belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("app_storage_resource_id")) pm.collectionVariables.set("app_storage_resource_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
