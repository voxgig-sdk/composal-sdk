$kind: http-request
id: ad73231f-6128-5e55-81de-e55fa25d418e
description: |-
  The `remove` operation of **app_storage_resource**.

  SDK: `client.AppStorageResource().remove({ app_id: "example", id: "example_id" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/storage_resources/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_storage_resource belongs to.
  - key: id
    value: "{{app_storage_resource_id}}"
    description: The app_storage_resource this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("app_storage_resource_id")
      }
    language: text/javascript
order: 10000
