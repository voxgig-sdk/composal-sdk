$kind: http-request
id: d6819bc2-8efc-5065-8051-f86af4617d4c
description: |-
  The `list` operation of **agent_swarm**.

  SDK: `client.AgentSwarm().list({ org: "example" })`
url: "{{base}}/api/v1/agent/swarms?org={{org}}"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: org
    value: "{{org}}"
  - key: page
    value: ""
    disabled: true
  - key: per_page
    value: ""
    disabled: true
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["swarms"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("agent_swarm_id")) pm.collectionVariables.set("agent_swarm_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
