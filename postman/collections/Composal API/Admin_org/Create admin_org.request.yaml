$kind: http-request
id: "1d5d527c-815b-5034-a865-5faa9d3e92fb"
description: |-
  The `create` operation of **admin_org**.

  SDK: `client.AdminOrg().create({ name: "example", owner_email: "example", slug: "example" })`
url: "{{base}}/api/v1/admin/organizations"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "example",
      "slug": "example",
      "owner_email": "user@example.com",
      "package_id": "example",
      "customize_onboarding_packages": true,
      "onboarding_package_keys": [
        "example"
      ],
      "onboarding_custom_pricing": true,
      "skip_payment": false,
      "monthly_price_dollars": "example",
      "billing_reason": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("admin_org_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
