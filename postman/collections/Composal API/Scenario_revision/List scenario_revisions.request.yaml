$kind: http-request
id: "5ac165bd-2d78-5c5e-9f75-b0757ab84010"
description: |-
  The `list` operation of **scenario_revision**.

  SDK: `client.ScenarioRevision().list({ organization_id: "example", project_id: "example", scenario_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/verification/projects/:project_id/scenarios/:id/revisions"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: page
    value: ""
    disabled: true
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this scenario_revision belongs to.
  - key: project_id
    value: "{{project_id}}"
    description: The project this scenario_revision belongs to.
  - key: id
    value: "{{scenario_id}}"
    description: "Input: scenario_id."
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["revisions"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("scenario_revision_id")) pm.collectionVariables.set("scenario_revision_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
