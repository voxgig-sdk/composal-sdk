$kind: http-request
id: "12b24519-4630-5e53-94f0-6e1d195015af"
description: |-
  The `remove` operation of **site_secret**.

  SDK: `client.SiteSecret().remove({ id: "example_id", organization_id: "example", site_id: "example" })`
url: "{{base}}/api/v1/spark/organizations/:organization_id/sites/:name/secrets/:secret_name"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this site_secret belongs to.
  - key: name
    value: "{{site_id}}"
    description: The site this site_secret belongs to.
  - key: secret_name
    value: "{{site_secret_id}}"
    description: The site_secret this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("site_secret_id")
      }
    language: text/javascript
order: 2000
