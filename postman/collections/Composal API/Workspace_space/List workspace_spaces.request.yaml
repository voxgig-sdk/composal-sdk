$kind: http-request
id: "8dda0054-0b21-54c1-9cea-3ed710dfa35d"
description: |-
  The `list` operation of **workspace_space**.

  SDK: `client.WorkspaceSpace().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/workspace_spaces"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this workspace_space belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["spaces"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("workspace_space_id")) pm.collectionVariables.set("workspace_space_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
