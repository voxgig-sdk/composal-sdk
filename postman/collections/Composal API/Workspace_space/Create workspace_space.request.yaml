$kind: http-request
id: "800f648e-e9b2-576b-ad2c-42864f010034"
description: |-
  The `create` operation of **workspace_space**.

  SDK: `client.WorkspaceSpace().create({ organization_id: "example", icon_name: "example", name: "example", slug: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/workspace_spaces"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this workspace_space belongs to.
body:
  type: json
  content: |-
    {
      "slug": "example",
      "name": "example",
      "description": "example",
      "default_branch": "example",
      "icon_name": "book-open"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["space"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("workspace_space_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
