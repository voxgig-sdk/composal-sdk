$kind: http-request
id: "4b937d85-e7cc-5355-bfba-78a344e8e99b"
description: |-
  The `create` operation of **cli_event**.

  SDK: `client.CliEvent().create({ event: "example", properties: {} })`
url: "{{base}}/api/v1/cli_events"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "event": "cli_command",
      "properties": {
        "command": "example",
        "invocation_id": "example",
        "cli_name": "com",
        "cli_version": "example",
        "os": "linux",
        "arch": "x86_64",
        "agent_mode": true,
        "json_mode": true,
        "success": true,
        "duration_ms": 1
      }
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("cli_event_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
