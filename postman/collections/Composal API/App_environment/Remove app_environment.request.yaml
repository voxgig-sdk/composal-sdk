$kind: http-request
id: c177f63d-74fe-5bbb-9c3d-2e8ae471144f
description: |-
  The `remove` operation of **app_environment**.

  SDK: `client.AppEnvironment().remove({ app_id: "example", id: "example_id" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/environments/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_environment belongs to.
  - key: id
    value: "{{app_environment_id}}"
    description: The app_environment this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("app_environment_id")
      }
    language: text/javascript
order: 9000
