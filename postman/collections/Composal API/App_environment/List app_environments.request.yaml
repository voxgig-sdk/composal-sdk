$kind: http-request
id: c37b3090-215e-5d34-a6f9-db33982072c3
description: |-
  The `list` operation of **app_environment**.

  SDK: `client.AppEnvironment().list({ app_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/environments"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_environment belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("app_environment_id")) pm.collectionVariables.set("app_environment_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
