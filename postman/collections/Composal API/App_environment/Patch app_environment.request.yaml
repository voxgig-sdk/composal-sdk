$kind: http-request
id: "2a2cb264-5975-595d-8924-ccc0e475af45"
description: |-
  The `patch` operation of **app_environment**.

  SDK: `client.AppEnvironment().patch({ app_id: "example", id: "example", auto_deploy: true })`
url: "{{base}}/api/v1/hosting/apps/:app_id/environments/:id"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_environment belongs to.
  - key: id
    value: "{{app_environment_id}}"
    description: The app_environment this request addresses.
body:
  type: json
  content: |-
    {
      "slug": "example",
      "name": "example",
      "kind": "production",
      "status": "active",
      "location_id": "{{location_id}}",
      "branch_pattern": "example",
      "base_domain": "example",
      "auto_deploy": true
    }
order: 5000
