$kind: http-request
id: "0cb4ae1a-add4-57d9-9cab-8491b4a930af"
description: |-
  The `remove` operation of **space_peer**.

  SDK: `client.SpacePeer().remove({ id: "example_id", space_id: "example" })`
url: "{{base}}/api/v1/networking/spaces/:space_id/peers/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: space_id
    value: "{{space_id}}"
    description: "Input: space_id."
  - key: id
    value: "{{space_peer_id}}"
    description: The space_peer this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("space_peer_id")
      }
    language: text/javascript
order: 11000
