$kind: http-request
id: fc9a0efc-12ec-5992-8c2f-02a51bc887bd
description: |-
  The `list` operation of **runner_lease**.

  SDK: `client.RunnerLease().list({ runner_id: "example", runner_pool_id: "example" })`
url: "{{base}}/api/v1/ci/runner_pools/:runner_pool_id/runners/:runner_id/leases"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: runner_pool_id
    value: "{{runner_pool_id}}"
    description: "Input: runner_pool_id."
  - key: runner_id
    value: "{{runner_id}}"
    description: "Input: runner_id."
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("runner_lease_id")) pm.collectionVariables.set("runner_lease_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
