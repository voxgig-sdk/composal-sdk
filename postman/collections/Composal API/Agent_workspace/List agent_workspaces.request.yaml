$kind: http-request
id: "5492727d-1f2b-54d4-8bbf-041b9d0b5ae0"
description: |-
  The `list` operation of **agent_workspace**.

  SDK: `client.AgentWorkspace().list({ agent_id: "example", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/workspaces"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: cursor
    value: ""
    disabled: true
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_workspace belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this agent_workspace belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["items"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("agent_workspace_id")) pm.collectionVariables.set("agent_workspace_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
