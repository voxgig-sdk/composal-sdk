$kind: http-request
id: "4a8a5637-aa7f-5818-9929-535b845d22a5"
description: |-
  The `list` operation of **organization_service_account**.

  SDK: `client.OrganizationServiceAccount().list({ organization_id: "example" })`
url: "{{base}}/api/v1/identity/organizations/:organization_id/service_accounts"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this organization_service_account belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("organization_service_account_id")) pm.collectionVariables.set("organization_service_account_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
