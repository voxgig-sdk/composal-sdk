$kind: http-request
id: ffb4c022-1066-5083-a84b-b8a239c67ce1
description: |-
  The `remove` operation of **organization_service_account**.

  SDK: `client.OrganizationServiceAccount().remove({ id: "example_id", organization_id: "example" })`
url: "{{base}}/api/v1/identity/organizations/:organization_id/service_accounts/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this organization_service_account belongs to.
  - key: id
    value: "{{organization_service_account_id}}"
    description: The organization_service_account this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("organization_service_account_id")
      }
    language: text/javascript
order: 9000
