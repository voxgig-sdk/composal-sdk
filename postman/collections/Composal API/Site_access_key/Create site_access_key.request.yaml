$kind: http-request
id: "9c0962a9-0c11-5fb9-8ed6-461e1a42adf7"
description: |-
  The `create` operation of **site_access_key**.

  SDK: `client.SiteAccessKey().create({ organization_id: "example", site_id: "example" })`
url: "{{base}}/api/v1/spark/organizations/:organization_id/sites/:name/access_keys"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this site_access_key belongs to.
  - key: name
    value: "{{site_id}}"
    description: The site this site_access_key belongs to.
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("site_access_key_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 2000
