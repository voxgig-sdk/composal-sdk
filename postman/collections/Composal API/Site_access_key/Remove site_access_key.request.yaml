$kind: http-request
id: "234ac93c-20ec-5e11-bedc-92b6e162b8ae"
description: |-
  The `remove` operation of **site_access_key**.

  SDK: `client.SiteAccessKey().remove({ id: "example", organization_id: "example", site_id: "example" })`
url: "{{base}}/api/v1/spark/organizations/:organization_id/sites/:name/access_keys/:key_id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this site_access_key belongs to.
  - key: name
    value: "{{site_id}}"
    description: The site this site_access_key belongs to.
  - key: key_id
    value: "{{site_access_key_id}}"
    description: The site_access_key this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("site_access_key_id")
      }
    language: text/javascript
order: 3000
