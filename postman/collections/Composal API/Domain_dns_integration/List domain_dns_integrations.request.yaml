$kind: http-request
id: "9dbb5cd7-36f2-5a73-b7eb-ab49497983a3"
description: |-
  The `list` operation of **domain_dns_integration**.

  SDK: `client.DomainDnsIntegration().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/domain_dns_integrations"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this domain_dns_integration belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["integrations"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("domain_dns_integration_id")) pm.collectionVariables.set("domain_dns_integration_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
