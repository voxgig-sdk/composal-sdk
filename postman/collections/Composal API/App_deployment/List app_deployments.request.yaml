$kind: http-request
id: "25992165-7f8f-553f-9c45-edd903c20514"
description: |-
  The `list` operation of **app_deployment**.

  SDK: `client.AppDeployment().list({ app_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/deployments"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_deployment belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("app_deployment_id")) pm.collectionVariables.set("app_deployment_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
