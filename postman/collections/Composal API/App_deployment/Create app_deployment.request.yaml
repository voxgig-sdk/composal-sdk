$kind: http-request
id: "9c6d8c0e-9534-553e-be67-6a9664d95f20"
description: |-
  The `create` operation of **app_deployment**.

  SDK: `client.AppDeployment().create({ app_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/deployments"
method: POST
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_deployment belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["deployment"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("app_deployment_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
