$kind: http-request
id: "18c0b20a-b251-5da3-bf54-825c670ca10f"
description: |-
  The `remove` operation of **app_deployment**.

  SDK: `client.AppDeployment().remove({ app_id: "example", id: "example_id" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/deployments/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_deployment belongs to.
  - key: id
    value: "{{app_deployment_id}}"
    description: The app_deployment this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("app_deployment_id")
      }
    language: text/javascript
order: 10000
