  SDK: `client.AppDeployment().load({ "app_id": "app_id", "id": "ID", $action: "live" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/deployments/:deployment_id/live"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_deployment belongs to.
  - key: deployment_id
    value: "{{app_deployment_id}}"
    description: The app_deployment this request addresses.
order: 8000
