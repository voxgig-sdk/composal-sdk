$kind: http-request
id: "92f239ac-c4e9-51b0-b68c-1ab76383c39f"
description: |-
  The `list` operation of **pairing**.

  SDK: `client.Pairing().list()`
url: "{{base}}/api/v1/relay/pairings"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("pairing_id")) pm.collectionVariables.set("pairing_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
