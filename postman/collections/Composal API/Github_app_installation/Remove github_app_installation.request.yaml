$kind: http-request
id: a81ea064-2a25-55fa-a3b9-ccf6e3564913
description: |-
  The `remove` operation of **github_app_installation**.

  SDK: `client.GithubAppInstallation().remove({ id: "example_id", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/github_app/installations/:id"
method: DELETE
headers:
  Accept: application/json
queryParams:
  - key: force
    value: ""
    disabled: true
  - key: uninstall_on_github
    value: ""
    disabled: true
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this github_app_installation belongs to.
  - key: id
    value: "{{github_app_installation_id}}"
    description: The github_app_installation this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("github_app_installation_id")
      }
    language: text/javascript
order: 3000
