$kind: http-request
id: "00a74cac-5f1e-5e3b-ba2f-171cebc21339"
description: |-
  The `list` operation of **github_app_installation**.

  SDK: `client.GithubAppInstallation().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/github_app/installations"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this github_app_installation belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["github_app_installations"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("github_app_installation_id")) pm.collectionVariables.set("github_app_installation_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
