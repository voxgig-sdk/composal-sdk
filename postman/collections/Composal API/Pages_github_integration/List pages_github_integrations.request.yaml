$kind: http-request
id: "36573a4c-b811-5d5f-94cb-76b0a9859879"
description: |-
  The `list` operation of **pages_github_integration**.

  SDK: `client.PagesGithubIntegration().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/pages/github_integrations"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this pages_github_integration belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["github_installations"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("pages_github_integration_id")) pm.collectionVariables.set("pages_github_integration_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
