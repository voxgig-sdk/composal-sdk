$kind: http-request
id: "04315255-7938-59ba-a1a7-34819a5bd4ed"
description: |-
  The `list` operation of **signal_subscription**.

  SDK: `client.SignalSubscription().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/signal_subscriptions"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this signal_subscription belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("signal_subscription_id")) pm.collectionVariables.set("signal_subscription_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
