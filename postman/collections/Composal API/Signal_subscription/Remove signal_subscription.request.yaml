$kind: http-request
id: "4f7d8298-15b5-5733-8571-55f9ce1574df"
description: |-
  The `remove` operation of **signal_subscription**.

  SDK: `client.SignalSubscription().remove({ id: "example_id", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/signal_subscriptions/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this signal_subscription belongs to.
  - key: id
    value: "{{signal_subscription_id}}"
    description: The signal_subscription this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("signal_subscription_id")
      }
    language: text/javascript
order: 6000
