description: |-
  The `create` operation of **stripe_webhook**.

  SDK: `client.StripeWebhook().create({  })`
url: "{{base}}/api/v1/stripe/webhooks"
method: POST
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("stripe_webhook_id", String(at(rec, "id")))
      }
    language: text/javascript
