$kind: http-request
id: "40b08cac-40ef-5cec-8996-d0f506894fb4"
description: |-
  The `list` operation of **organization**.

  SDK: `client.Organization().list()`
url: "{{base}}/api/v1/organizations"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["organizations"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("organization_id")) pm.collectionVariables.set("organization_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
