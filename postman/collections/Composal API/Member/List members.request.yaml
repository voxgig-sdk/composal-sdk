$kind: http-request
id: ff626f1d-9323-5d63-8cd0-5d0b12306490
description: |-
  The `list` operation of **member**.

  SDK: `client.Member().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/members"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this member belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["invitations"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("member_id")) pm.collectionVariables.set("member_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
