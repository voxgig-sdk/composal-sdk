$kind: http-request
id: "8fcf579f-b97a-58f5-a6de-82ef9be7acd1"
description: |-
  The `list` operation of **billing_invoice**.

  SDK: `client.BillingInvoice().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/billing/invoices"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this billing_invoice belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["invoices"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("billing_invoice_id")) pm.collectionVariables.set("billing_invoice_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
