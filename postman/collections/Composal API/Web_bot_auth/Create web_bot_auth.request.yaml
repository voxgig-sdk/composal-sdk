  SDK: `client.WebBotAuth().create({ origin: "example" })`
url: "{{base}}/api/v1/verify/web_bot_auth"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "origin": "https://example.com"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("web_bot_auth_id", String(at(rec, "id")))
      }
    language: text/javascript
