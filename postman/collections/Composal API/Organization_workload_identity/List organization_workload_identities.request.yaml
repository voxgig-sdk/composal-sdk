$kind: http-request
id: "03114366-82e3-520a-9ff4-8b3201b2d6d5"
description: |-
  The `list` operation of **organization_workload_identity**.

  SDK: `client.OrganizationWorkloadIdentity().list({ organization_id: "example" })`
url: "{{base}}/api/v1/identity/organizations/:organization_id/workload_identities"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this organization_workload_identity belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("organization_workload_identity_id")) pm.collectionVariables.set("organization_workload_identity_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
