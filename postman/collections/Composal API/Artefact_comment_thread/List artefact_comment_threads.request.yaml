$kind: http-request
id: "6eda58a6-48b5-5e12-97ab-4e31fa3ec893"
description: |-
  The `list` operation of **artefact_comment_thread**.

  SDK: `client.ArtefactCommentThread().list({ artefact_id: "example", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/artefacts/:artefact_ref/comment_threads"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this artefact_comment_thread belongs to.
  - key: artefact_ref
    value: "{{artefact_id}}"
    description: The artefact this artefact_comment_thread belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["threads"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("artefact_comment_thread_id")) pm.collectionVariables.set("artefact_comment_thread_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
