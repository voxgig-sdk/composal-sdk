$kind: http-request
id: "8d0e7d8e-ea53-594b-af56-d3da137e2fa9"
description: |-
  The `remove` operation of **agent_connection**.

  SDK: `client.AgentConnection().remove({ id: "example_id", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agent_connections/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_connection belongs to.
  - key: id
    value: "{{agent_connection_id}}"
    description: The agent_connection this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("agent_connection_id")
      }
    language: text/javascript
order: 20000
