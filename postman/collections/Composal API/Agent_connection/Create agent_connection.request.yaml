$kind: http-request
id: bcc4df07-af90-5aa0-969f-22a45d4c3084
description: |-
  The `create` operation of **agent_connection**.

  SDK: `client.AgentConnection().create({ organization_id: "example", name: "example", toolkit: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agent_connections"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_connection belongs to.
body:
  type: json
  content: |-
    {
      "toolkit": "example",
      "name": "example",
      "creation_key": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["connection"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("agent_connection_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
