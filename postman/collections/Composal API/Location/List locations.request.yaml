$kind: http-request
id: ff315750-1f36-5d18-ba49-50099f01333e
description: |-
  The `list` operation of **location**.

  SDK: `client.Location().list()`
url: "{{base}}/api/v1/hosting/locations"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["locations"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("location_id")) pm.collectionVariables.set("location_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
