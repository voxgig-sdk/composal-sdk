$kind: http-request
id: "4f77c133-3baa-5bc7-8f33-c9d5a5d7c60b"
description: |-
  The `list` operation of **agent_connection_delegation**.

  SDK: `client.AgentConnectionDelegation().list({ agent_connection_id: "example", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agent_connections/:id/delegations"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_connection_delegation belongs to.
  - key: id
    value: "{{agent_connection_id}}"
    description: The agent_connection this agent_connection_delegation belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["delegations"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("agent_connection_delegation_id")) pm.collectionVariables.set("agent_connection_delegation_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
