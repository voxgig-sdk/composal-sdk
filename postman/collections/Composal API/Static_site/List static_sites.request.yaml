$kind: http-request
id: "83bfee3b-ab79-5b86-a647-5757491ebaeb"
description: |-
  The `list` operation of **static_site**.

  SDK: `client.StaticSite().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/static_sites"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this static_site belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["static_sites"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("static_site_id")) pm.collectionVariables.set("static_site_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
