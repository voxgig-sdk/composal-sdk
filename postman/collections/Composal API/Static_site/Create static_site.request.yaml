$kind: http-request
id: b777ab79-8864-5df8-a9f5-aca4135f904e
description: |-
  The `create` operation of **static_site**.

  SDK: `client.StaticSite().create({ organization_id: "example", name: "example", slug: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/static_sites"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this static_site belongs to.
body:
  type: json
  content: |-
    {
      "slug": "example",
      "name": "example",
      "description": "example",
      "region": "example",
      "replication_regions": [
        "example"
      ],
      "index_document": "example",
      "error_document": "example",
      "hosted_app_id": "example",
      "repository_id": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["static_site"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("static_site_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
