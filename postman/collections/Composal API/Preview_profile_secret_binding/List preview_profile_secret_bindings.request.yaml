  - key: preview_profile_id
    value: "{{preview_profile_id}}"
    description: "Input: preview_profile_id."
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("preview_profile_secret_binding_id")) pm.collectionVariables.set("preview_profile_secret_binding_id", String(at(rec, "id")))
      }
    language: text/javascript
