  SDK: `client.PreviewProfileSecretBinding().list({ app_id: "example", preview_profile_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/preview_profiles/:preview_profile_id/secret_bindings"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: app_id
