$kind: http-request
id: "44e437c5-8762-5a50-b2e4-de9ac6a3d3d5"
description: |-
  The `list` operation of **vcs_node**.

  SDK: `client.VcsNode().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/pages/vcs_nodes"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this vcs_node belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["github_installations"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("vcs_node_id")) pm.collectionVariables.set("vcs_node_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
