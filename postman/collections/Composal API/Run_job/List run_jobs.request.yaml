method: GET
headers:
  Accept: application/json
pathVariables:
  - key: pipeline_id
    value: "{{pipeline_id}}"
    description: "Input: pipeline_id."
  - key: run_id
    value: "{{run_id}}"
    description: "Input: run_id."
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("run_job_id")) pm.collectionVariables.set("run_job_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
