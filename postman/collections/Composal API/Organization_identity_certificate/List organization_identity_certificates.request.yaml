id: c1eea1fc-e618-5e69-8ecb-e2f353e84847
description: |-
  The `list` operation of **organization_identity_certificate**.

  SDK: `client.OrganizationIdentityCertificate().list({ organization_id: "example" })`
url: "{{base}}/api/v1/identity/organizations/:organization_id/identity_certificates"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this organization_identity_certificate belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("organization_identity_certificate_id")) pm.collectionVariables.set("organization_identity_certificate_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
