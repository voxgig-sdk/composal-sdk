$kind: http-request
id: e8e4ec23-f915-527f-8521-f320a30bfec2
description: |-
  The `remove` operation of **organization_identity_certificate**.

  SDK: `client.OrganizationIdentityCertificate().remove({ id: "example_id", organization_id: "example" })`
url: "{{base}}/api/v1/identity/organizations/:organization_id/identity_certificates/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this organization_identity_certificate belongs to.
  - key: id
    value: "{{organization_identity_certificate_id}}"
    description: The organization_identity_certificate this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("organization_identity_certificate_id")
      }
    language: text/javascript
order: 8000
