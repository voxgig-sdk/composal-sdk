$kind: http-request
id: "2d9043b4-b96f-5e14-8f55-9b9dc5f4c5bc"
description: |-
  The `list` operation of **preview_operation**.

  SDK: `client.PreviewOperation().list({ app_id: "example", preview_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/previews/:id/operations"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this preview_operation belongs to.
  - key: id
    value: "{{preview_id}}"
    description: "Input: preview_id."
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("preview_operation_id")) pm.collectionVariables.set("preview_operation_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
