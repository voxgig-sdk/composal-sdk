description: |-
  The `list` operation of **space_group_membership**.

  SDK: `client.SpaceGroupMembership().list({ space_id: "example" })`
url: "{{base}}/api/v1/networking/spaces/:space_id/group_memberships"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: space_id
    value: "{{space_id}}"
    description: "Input: space_id."
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("space_group_membership_id")) pm.collectionVariables.set("space_group_membership_id", String(at(rec, "id")))
      }
    language: text/javascript
