$kind: http-request
id: ee969817-d2a6-5c16-a80c-da87065cdb5c
description: |-
  The `create` operation of **project**.

  SDK: `client.Project().create({ organization_id: "example", name: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/verification/projects"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this project belongs to.
body:
  type: json
  content: |-
    {
      "execution_mode": "website",
      "verifier_preferences": {
        "terminology": "example",
        "behavior_guidance": "example",
        "report_style": "example",
        "reporting_focus": "example",
        "prioritization": "example"
      },
      "slug": "example",
      "name": "example",
      "website_url": "https://example.com",
      "purpose": "example",
      "context": "example",
      "documentation_urls": [
        "https://example.com"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("project_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
