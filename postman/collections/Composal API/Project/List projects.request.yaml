$kind: http-request
id: dfc99c51-4f9a-5339-a7fc-9617c14427df
description: |-
  The `list` operation of **project**.

  SDK: `client.Project().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/verification/projects"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this project belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["projects"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("project_id")) pm.collectionVariables.set("project_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
