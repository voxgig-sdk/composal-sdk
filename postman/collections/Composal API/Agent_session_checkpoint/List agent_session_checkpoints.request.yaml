$kind: http-request
id: "2fd3106d-0205-5c20-ae03-7e95f31d3686"
description: |-
  The `list` operation of **agent_session_checkpoint**.

  SDK: `client.AgentSessionCheckpoint().list({ agent_session_id: "example", organization_id: "example", repo_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/agent_sessions/:agent_session_id/checkpoints"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this agent_session_checkpoint belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this agent_session_checkpoint belongs to.
  - key: agent_session_id
    value: "{{agent_session_id}}"
    description: The agent_session this agent_session_checkpoint belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("agent_session_checkpoint_id")) pm.collectionVariables.set("agent_session_checkpoint_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
