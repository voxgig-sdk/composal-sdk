$kind: http-request
id: "3ed5dea2-1274-59fd-816a-61b3df806a58"
description: |-
  The `list` operation of **vc_stack**.

  SDK: `client.VcStack().list({ organization_id: "example", repo_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/vcs/stacks"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this vc_stack belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this vc_stack belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["stacks"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("vc_stack_id")) pm.collectionVariables.set("vc_stack_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
