$kind: http-request
id: df533cc7-3eb1-520b-ba7e-7e868429385a
description: |-
  The `list` operation of **repo_stat**.

  SDK: `client.RepoStat().list({ organization_id: "example", repo_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/stats"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this repo_stat belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this repo_stat belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["repository_stats"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("repo_stat_id")) pm.collectionVariables.set("repo_stat_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
