$kind: http-request
id: "00cc0974-aeb7-5bdb-a013-4f6e7a2725d4"
description: |-
  The `create` operation of **agent_manager**.

  SDK: `client.AgentManager().create({ agent_id: "example", organization_id: "example", user_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/managers"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_manager belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this agent_manager belongs to.
body:
  type: json
  content: |-
    {
      "user_id": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["agent"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("agent_manager_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
