$kind: http-request
id: b0e49304-6f2f-5608-a8d7-63f66b0306d4
description: |-
  The `list` operation of **verify_email_verification**.

  SDK: `client.VerifyEmailVerification().list()`
url: "{{base}}/api/v1/email_verifications/verify"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("verify_email_verification_id")) pm.collectionVariables.set("verify_email_verification_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
