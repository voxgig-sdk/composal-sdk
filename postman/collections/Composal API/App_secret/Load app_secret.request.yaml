$kind: http-request
id: "29838d82-d53b-5bc2-bac5-c6377a5ccf29"
description: |-
  The `load` operation of **app_secret**.

  SDK: `client.AppSecret().load({ app_id: "example", id: "example_id" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/secrets/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_secret belongs to.
  - key: id
    value: "{{app_secret_id}}"
    description: The app_secret this request addresses.
order: 2000
