$kind: http-request
id: bcf74f5b-6395-5d63-b861-df015f7fe22b
description: |-
  The `patch` operation of **app_secret**.

  SDK: `client.AppSecret().patch({ app_id: "example", id: "example", description: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/secrets/:id"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_secret belongs to.
  - key: id
    value: "{{app_secret_id}}"
    description: The app_secret this request addresses.
body:
  type: json
  content: |-
    {
      "name": "example",
      "env_key": "example",
      "description": "example",
      "rotation_policy": "example",
      "expose_to_build": true
    }
order: 5000
