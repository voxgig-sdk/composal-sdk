$kind: http-request
id: "08deba94-ac3f-54f5-a823-560f1e5026fb"
description: |-
  The `list` operation of **app_secret**.

  SDK: `client.AppSecret().list({ app_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/secrets"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_secret belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["secrets"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("app_secret_id")) pm.collectionVariables.set("app_secret_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
