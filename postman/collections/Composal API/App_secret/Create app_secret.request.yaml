$kind: http-request
id: "9ae3f70f-d5a5-51f2-9535-9487bbfe1ede"
description: |-
  The `create` operation of **app_secret**.

  SDK: `client.AppSecret().create({ app_id: "example", name: "example", slug: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/secrets"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_secret belongs to.
body:
  type: json
  content: |-
    {
      "slug": "example",
      "name": "example",
      "env_key": "example",
      "description": "example",
      "rotation_policy": "example",
      "expose_to_build": true,
      "value": "example",
      "value_kind": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("app_secret_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
