$kind: http-request
id: "75009c18-7a79-5eea-85c5-b8aca94cefb1"
description: |-
  The `remove` operation of **app_secret**.

  SDK: `client.AppSecret().remove({ app_id: "example", id: "example_id" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/secrets/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_secret belongs to.
  - key: id
    value: "{{app_secret_id}}"
    description: The app_secret this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("app_secret_id")
      }
    language: text/javascript
order: 10000
