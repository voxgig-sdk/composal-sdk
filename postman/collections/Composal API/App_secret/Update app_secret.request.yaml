$kind: http-request
id: e49d9937-cc91-5111-bf47-920949017079
description: |-
  The `update` operation of **app_secret**.

  SDK: `client.AppSecret().update({ app_id: "example", id: "example", description: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/secrets/:id"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_secret belongs to.
  - key: id
    value: "{{app_secret_id}}"
    description: The app_secret this request addresses.
body:
  type: json
  content: |-
    {
      "name": "example",
      "env_key": "example",
      "description": "example",
      "rotation_policy": "example",
      "expose_to_build": true
    }
order: 4000
