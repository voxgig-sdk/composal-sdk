$kind: http-request
id: "4b6f78cc-ebdb-59bf-b4f1-1a2fc264f525"
description: |-
  The `list` operation of **agent_write_permission**.

  SDK: `client.AgentWritePermission().list({ agent_id: "example", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/write_permissions"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_write_permission belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this agent_write_permission belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["items"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("agent_write_permission_id")) pm.collectionVariables.set("agent_write_permission_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
