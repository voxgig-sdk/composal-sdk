$kind: http-request
id: "6b72037e-f0de-532f-83f3-5aa6754af3c1"
description: |-
  The `list` operation of **ci_pipeline**.

  SDK: `client.CiPipeline().list()`
url: "{{base}}/api/v1/ci/pipelines"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["pipelines"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("ci_pipeline_id")) pm.collectionVariables.set("ci_pipeline_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
