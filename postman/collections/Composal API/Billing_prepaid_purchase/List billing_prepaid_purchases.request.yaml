$kind: http-request
id: a66b5da6-7598-5a37-8a14-e08be9efa6ef
description: |-
  The `list` operation of **billing_prepaid_purchase**.

  SDK: `client.BillingPrepaidPurchase().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/billing/prepaid_purchases"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this billing_prepaid_purchase belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["purchases"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("billing_prepaid_purchase_id")) pm.collectionVariables.set("billing_prepaid_purchase_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
