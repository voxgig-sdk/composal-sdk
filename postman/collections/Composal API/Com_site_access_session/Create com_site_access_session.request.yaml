id: e2af0abc-a68c-5b7c-89cf-dc056c17a011
description: |-
  The `create` operation of **com_site_access_session**.

  SDK: `client.ComSiteAccessSession().create({ host: "example" })`
url: "{{base}}/api/v1/com_site_access/sessions"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "host": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("com_site_access_session_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
