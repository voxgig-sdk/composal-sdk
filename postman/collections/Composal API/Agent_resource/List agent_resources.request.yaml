$kind: http-request
id: "68087643-dacd-5fc5-8dc7-d98279617ed5"
description: |-
  The `list` operation of **agent_resource**.

  SDK: `client.AgentResource().list({ agent_id: "example", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/relay/resources"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_resource belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this agent_resource belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["resources"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("agent_resource_id")) pm.collectionVariables.set("agent_resource_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
