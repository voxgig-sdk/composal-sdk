$kind: http-request
id: "53783c30-81be-5a6c-a434-838db5e1a0bb"
description: |-
  The `create` operation of **relay_agent_connection**.

  SDK: `client.RelayAgentConnection().create({ agent_id: "example", organization_id: "example", agent_card_url: "example", auth_scheme: "example", name: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/relay/connections"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Idempotency-Key: "{{idempotency_key}}"
  X-Composal-Relay-Scope: "{{x_composal_relay_scope}}"
  X-Composal-Requester-Id: "{{x_composal_requester_id}}"
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this relay_agent_connection belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this relay_agent_connection belongs to.
body:
  type: json
  content: |-
    {
      "name": "example",
      "auth_scheme": "bearer",
      "credential": "example",
      "remote_agent": "example",
      "agent_card_url": "https://example.com",
      "source_operation_id": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["connection"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("relay_agent_connection_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
