$kind: http-request
id: bb78e49c-dfa7-5cb3-9685-a6608c932a06
description: |-
  The `list` operation of **catalog_selector**.

  SDK: `client.CatalogSelector().list({ app_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/catalog/selectors"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this catalog_selector belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["app"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("catalog_selector_id")) pm.collectionVariables.set("catalog_selector_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
