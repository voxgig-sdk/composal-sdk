$kind: http-request
id: "872499c8-271f-5e8d-9d65-98e30fcd50c0"
description: |-
  The `create` operation of **repo_bookmark_protection**.

  SDK: `client.RepoBookmarkProtection().create({ organization_id: "example", repo_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/bookmark_protections"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this repo_bookmark_protection belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this repo_bookmark_protection belongs to.
body:
  type: json
  content: |-
    {
      "name": "example",
      "enabled": true,
      "priority": 1,
      "target_kind": "exact",
      "target_pattern": "example",
      "bypass_mode": "admins",
      "requirements": {
        "ci": {
          "mode": "none",
          "require_all": true,
          "required_checks": [
            "example"
          ]
        }
      },
      "actor_policy": {}
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("repo_bookmark_protection_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
