$kind: http-request
id: "29119578-4e25-5a7d-b096-ca3799043f14"
description: |-
  The `list` operation of **repo_bookmark_protection**.

  SDK: `client.RepoBookmarkProtection().list({ organization_id: "example", repo_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/bookmark_protections"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this repo_bookmark_protection belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this repo_bookmark_protection belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("repo_bookmark_protection_id")) pm.collectionVariables.set("repo_bookmark_protection_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
