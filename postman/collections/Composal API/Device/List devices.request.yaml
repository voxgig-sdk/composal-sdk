$kind: http-request
id: a4051300-b6d6-53bc-bc4d-52aed02e3b1d
description: |-
  The `list` operation of **device**.

  SDK: `client.Device().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/devices"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: cursor
    value: ""
    disabled: true
  - key: include_revoked
    value: "false"
    disabled: true
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this device belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["devices"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("device_id")) pm.collectionVariables.set("device_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
