$kind: http-request
id: ac6f0644-05c0-56e7-bbb1-12b7437d755e
description: |-
  The `list` operation of **execution_reconciler_tick**.

  SDK: `client.ExecutionReconcilerTick().list()`
url: "{{base}}/api/v1/execution/reconciler_ticks"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("execution_reconciler_tick_id")) pm.collectionVariables.set("execution_reconciler_tick_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
