$kind: http-request
id: "341ac5d6-f9f5-5b09-85f7-3fefaa3b8e3d"
description: |-
  The `remove` operation of **app_data_resource**.

  SDK: `client.AppDataResource().remove({ app_id: "example", id: "example_id" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/data_resources/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_data_resource belongs to.
  - key: id
    value: "{{app_data_resource_id}}"
    description: The app_data_resource this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("app_data_resource_id")
      }
    language: text/javascript
order: 11000
