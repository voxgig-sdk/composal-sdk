$kind: http-request
id: "309af0fc-e686-5c10-b356-258a7d50aea7"
description: |-
  The `create` operation of **image_repository**.

  SDK: `client.ImageRepository().create({ organization_id: "example", name: "example", slug: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/image_repositories"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this image_repository belongs to.
body:
  type: json
  content: |-
    {
      "hosted_app_id": "example",
      "slug": "example",
      "name": "example",
      "provider_kind": "oci",
      "repository_path": "example",
      "visibility": "private",
      "status": "active",
      "registry_auth_token": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["image_repository"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("image_repository_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 2000
