$kind: http-request
id: "45dfa809-e759-544b-abf0-e45ea3a06f9a"
description: |-
  The `list` operation of **image_repository**.

  SDK: `client.ImageRepository().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/image_repositories"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this image_repository belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["image_repositories"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("image_repository_id")) pm.collectionVariables.set("image_repository_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
