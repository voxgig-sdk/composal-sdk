$kind: http-request
id: "731df51c-234c-5be2-afc0-b8c431a38110"
description: |-
  The `list` operation of **docker_builder_setting**.

  SDK: `client.DockerBuilderSetting().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/docker_builder_settings"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this docker_builder_setting belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["docker_builder_settings"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("docker_builder_setting_id")) pm.collectionVariables.set("docker_builder_setting_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
