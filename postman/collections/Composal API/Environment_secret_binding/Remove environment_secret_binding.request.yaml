$kind: http-request
id: b2722c8e-bd6a-537b-bfd1-c60b4072cacd
description: |-
  The `remove` operation of **environment_secret_binding**.

  SDK: `client.EnvironmentSecretBinding().remove({ app_id: "example", environment_id: "example", id: "example_id" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/environments/:environment_id/secret_bindings/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this environment_secret_binding belongs to.
  - key: environment_id
    value: "{{environment_id}}"
    description: The environment this environment_secret_binding belongs to.
  - key: id
    value: "{{environment_secret_binding_id}}"
    description: The environment_secret_binding this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("environment_secret_binding_id")
      }
    language: text/javascript
order: 4000
