$kind: http-request
id: "7800a777-72f4-5fb6-959f-3fac0b949857"
description: |-
  The `list` operation of **environment_secret_binding**.

  SDK: `client.EnvironmentSecretBinding().list({ app_id: "example", environment_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/environments/:environment_id/secret_bindings"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this environment_secret_binding belongs to.
  - key: environment_id
    value: "{{environment_id}}"
    description: The environment this environment_secret_binding belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("environment_secret_binding_id")) pm.collectionVariables.set("environment_secret_binding_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
