$kind: http-request
id: "21dd4a4d-c321-5fb1-b345-e3e75935e0cb"
description: |-
  The `create` operation of **environment_secret_binding**.

  SDK: `client.EnvironmentSecretBinding().create({ app_id: "example", environment_id: "example", env_key: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/environments/:environment_id/secret_bindings"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this environment_secret_binding belongs to.
  - key: environment_id
    value: "{{environment_id}}"
    description: The environment this environment_secret_binding belongs to.
body:
  type: json
  content: |-
    {
      "env_key": "example",
      "mode": "linked",
      "secret_id": "example",
      "secret_version_id": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("environment_secret_binding_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 2000
