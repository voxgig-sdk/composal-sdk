$kind: http-request
id: da4a8b7b-52cb-563e-80da-f35ff8b4b0dd
description: |-
  The `list` operation of **node**.

  SDK: `client.Node().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/pages/nodes"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this node belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["github_installations"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("node_id")) pm.collectionVariables.set("node_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
