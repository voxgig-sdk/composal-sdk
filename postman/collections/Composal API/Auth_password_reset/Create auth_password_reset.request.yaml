$kind: http-request
id: "16398ffc-ba6b-56aa-972b-d326b21785df"
description: |-
  The `create` operation of **auth_password_reset**.

  SDK: `client.AuthPasswordReset().create({ email: "example" })`
url: "{{base}}/api/v1/auth/password_resets"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("auth_password_reset_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
