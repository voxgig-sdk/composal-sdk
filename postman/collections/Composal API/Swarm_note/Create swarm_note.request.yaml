$kind: http-request
id: "790b7812-9154-569b-a466-687d3808ba5f"
description: |-
  The `create` operation of **swarm_note**.

  SDK: `client.SwarmNote().create({ swarm_id: "example", text: "example" })`
url: "{{base}}/api/v1/agent/swarms/:swarm_id/notes"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: swarm_id
    value: "{{swarm_id}}"
    description: "Input: swarm_id."
body:
  type: json
  content: |-
    {
      "text": "example",
      "task_id": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("swarm_note_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
