$kind: http-request
id: c58e3c8c-4432-507b-ba56-9364a91f3ad3
description: |-
  The `list` operation of **agent_event**.

  SDK: `client.AgentEvent().list({ agent_id: "example", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/events"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: conversation_id
    value: main
    disabled: true
  - key: device_activity_providers
    value: codex
    disabled: true
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_event belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this agent_event belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("agent_event_id")) pm.collectionVariables.set("agent_event_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
