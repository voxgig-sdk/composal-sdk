$kind: http-request
id: "61fdaf2a-df8b-5e97-ab14-045a9492996d"
description: |-
  The `create` operation of **app**.

  SDK: `client.App().create({ name: "example", organization_id: "example", repository_id: "example", root_path: "example", slug: "example" })`
url: "{{base}}/api/v1/hosting/apps"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "organization_id": "{{organization_id}}",
      "repository_id": "example",
      "slug": "example",
      "name": "example",
      "description": "example",
      "root_path": "example",
      "framework": "example",
      "status": "draft"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["app"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("app_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
