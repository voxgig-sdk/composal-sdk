$kind: http-request
id: d09333cd-bce9-5879-8ffa-93941ee69810
description: |-
  The `list` operation of **app**.

  SDK: `client.App().list()`
url: "{{base}}/api/v1/hosting/apps"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: organization_id
    value: ""
    disabled: true
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["apps"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("app_id")) pm.collectionVariables.set("app_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
