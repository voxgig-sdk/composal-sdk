    value: "{{organization_id}}"
    description: The organization this agent_automation belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this agent_automation belongs to.
  - key: automation_key
    value: "{{agent_automation_id}}"
    description: The agent_automation this request addresses.
body:
