$kind: http-request
id: "24815fe7-fe8d-5e42-a80c-18f7cb0f4c12"
description: |-
  The `schedule` action of **agent_automation**, a route of its `update` operation.

  SDK: `client.AgentAutomation().update({ "organization_id": "organization_id", "agent_id": "agent_id", "id": "ID", $action: "schedule" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/automations/:automation_key/schedule"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
