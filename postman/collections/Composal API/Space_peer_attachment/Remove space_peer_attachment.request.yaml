$kind: http-request
id: "329ca74f-b6e8-53fb-9188-62232f22dc9a"
description: |-
  The `remove` operation of **space_peer_attachment**.

  SDK: `client.SpacePeerAttachment().remove({ id: "example_id", space_id: "example" })`
url: "{{base}}/api/v1/networking/spaces/:space_id/peer_attachments/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: space_id
    value: "{{space_id}}"
    description: "Input: space_id."
  - key: id
    value: "{{space_peer_attachment_id}}"
    description: The space_peer_attachment this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("space_peer_attachment_id")
      }
    language: text/javascript
order: 5000
