$kind: http-request
id: "6e8fd2c3-de0c-522f-bced-259907c6bf79"
description: |-
  The `create` operation of **app_service**.

  SDK: `client.AppService().create({ app_id: "example", auto_deploy: true, desired_instances: 1, kind: "example", name: "example", publicly_accessible: true, runtime: "example", runtime_adapter_kind: "example", slug: "example", source_path: "example", start_command: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/services"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_service belongs to.
body:
  type: json
  content: |-
    {
      "slug": "example",
      "name": "example",
      "kind": "web",
      "runtime": "docker",
      "runtime_adapter_kind": "nomad",
      "runtime_adapter_settings_json": "example",
      "nomad_namespace": "example",
      "nomad_region": "example",
      "cpu_mhz": 1,
      "memory_mb": 1,
      "memory_max_mb": 1,
      "disk_mb": 1,
      "nomad_constraints_json": "example",
      "nomad_update_strategy_json": "example",
      "nomad_ulimits_json": "example",
      "nomad_kill_timeout_seconds": 1,
      "nomad_shutdown_delay_seconds": 1,
      "source_path": "example",
      "build_command": "example",
      "release_command": "example",
      "prestart_command": "example",
      "start_command": "example",
      "healthcheck_path": "example",
      "schedule": "example",
      "internal_port": 1,
      "desired_instances": 1,
      "publicly_accessible": true,
      "auto_deploy": true,
      "deploy_paths": [
        "example"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["service"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("app_service_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
