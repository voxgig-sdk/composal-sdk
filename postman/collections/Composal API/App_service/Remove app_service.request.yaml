$kind: http-request
id: "73c0e05a-1e5e-5107-b16a-d36d14d371e7"
description: |-
  The `remove` operation of **app_service**.

  SDK: `client.AppService().remove({ app_id: "example", id: "example_id" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/services/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_service belongs to.
  - key: id
    value: "{{app_service_id}}"
    description: The app_service this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("app_service_id")
      }
    language: text/javascript
order: 9000
