$kind: http-request
id: f84e7eb1-4d9a-5f75-805b-fa9c409fdbb3
description: |-
  The `create` operation of **organization_invitation**.

  SDK: `client.OrganizationInvitation().create({ organization_id: "example", email: "example", role: "example" })`
url: "{{base}}/api/v1/admin/organizations/:org_slug/invitations"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this organization_invitation belongs to.
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "role": "owner"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("organization_invitation_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
