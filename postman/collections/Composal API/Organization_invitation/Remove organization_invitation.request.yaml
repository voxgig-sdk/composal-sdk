$kind: http-request
id: f46aa8f6-08e7-5b7a-a7d1-5ed011874f9d
description: |-
  The `remove` operation of **organization_invitation**.

  SDK: `client.OrganizationInvitation().remove({ id: "example_id", organization_id: "example" })`
url: "{{base}}/api/v1/admin/organizations/:org_slug/invitations/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this organization_invitation belongs to.
  - key: id
    value: "{{organization_invitation_id}}"
    description: The organization_invitation this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("organization_invitation_id")
      }
    language: text/javascript
order: 2000
