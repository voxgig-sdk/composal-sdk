$kind: http-request
id: af608701-442d-5a5e-b3c8-dd527eca56c9
description: |-
  The `list` operation of **signal**.

  SDK: `client.Signal().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/signals"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: after_id
    value: ""
    disabled: true
  - key: before_id
