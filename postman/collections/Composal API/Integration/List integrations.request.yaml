$kind: http-request
id: "3bc902ca-fec9-5d2a-870b-27d55ac49018"
description: |-
  The `list` operation of **integration**.

  SDK: `client.Integration().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/verification/integrations"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this integration belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("integration_id")) pm.collectionVariables.set("integration_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
