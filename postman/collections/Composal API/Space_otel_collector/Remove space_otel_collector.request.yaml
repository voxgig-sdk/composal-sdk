$kind: http-request
id: "75019495-184b-5c9c-ae2a-060660c5e118"
description: |-
  The `remove` operation of **space_otel_collector**.

  SDK: `client.SpaceOtelCollector().remove({ id: "example_id", space_id: "example" })`
url: "{{base}}/api/v1/observability/spaces/:space_id/otel_collectors/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: space_id
    value: "{{space_id}}"
    description: "Input: space_id."
  - key: id
    value: "{{space_otel_collector_id}}"
    description: The space_otel_collector this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("space_otel_collector_id")
      }
    language: text/javascript
order: 14000
