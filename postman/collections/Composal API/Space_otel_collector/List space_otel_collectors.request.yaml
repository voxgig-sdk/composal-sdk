$kind: http-request
id: "8b02b975-8cbc-5917-a28e-9c93b20d0684"
description: |-
  The `list` operation of **space_otel_collector**.

  SDK: `client.SpaceOtelCollector().list({ space_id: "example" })`
url: "{{base}}/api/v1/observability/spaces/:space_id/otel_collectors"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: space_id
    value: "{{space_id}}"
    description: "Input: space_id."
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("space_otel_collector_id")) pm.collectionVariables.set("space_otel_collector_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
