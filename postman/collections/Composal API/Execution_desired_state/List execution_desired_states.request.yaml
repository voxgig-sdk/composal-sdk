description: |-
  The `list` operation of **execution_desired_state**.

  SDK: `client.ExecutionDesiredState().list()`
url: "{{base}}/api/v1/execution/desired_states"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("execution_desired_state_id")) pm.collectionVariables.set("execution_desired_state_id", String(at(rec, "id")))
      }
    language: text/javascript
