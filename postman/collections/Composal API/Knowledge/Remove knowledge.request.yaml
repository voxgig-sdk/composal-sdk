$kind: http-request
id: fbf17790-806c-56c8-b91a-029c84da126f
description: |-
  The `remove` operation of **knowledge**.

  SDK: `client.Knowledge().remove({ id: "example_id", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/verify/knowledge/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this knowledge belongs to.
  - key: id
    value: "{{knowledge_id}}"
    description: The knowledge this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("knowledge_id")
      }
    language: text/javascript
order: 6000
