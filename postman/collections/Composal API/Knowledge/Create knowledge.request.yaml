$kind: http-request
id: "7a1ea2b7-75b7-57b8-9038-eafff06c0ece"
description: |-
  The `create` operation of **knowledge**.

  SDK: `client.Knowledge().create({ organization_id: "example", markdown: "example", project_id: "example", title: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/verify/knowledge"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this knowledge belongs to.
body:
  type: json
  content: |-
    {
      "project_id": "{{project_id}}",
      "title": "example",
      "markdown": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("knowledge_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
