$kind: http-request
id: ac7f6961-350a-5341-b478-6f2b766bb939
description: |-
  The `list` operation of **dream**.

  SDK: `client.Dream().list({ organization_id: "example", project_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/verify/dreams?project_id={{project_id}}"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: page
    value: ""
    disabled: true
  - key: project_id
    value: "{{project_id}}"
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this dream belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["dreams"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("dream_id")) pm.collectionVariables.set("dream_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
