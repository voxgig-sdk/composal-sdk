$kind: http-request
id: "662126a9-68b6-54cf-996d-182dc62ad743"
description: |-
  The `create` operation of **app_location**.

  SDK: `client.AppLocation().create({ app_id: "example", location_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/locations"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_location belongs to.
body:
  type: json
  content: |-
    {
      "location_id": "{{location_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["location"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("app_location_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 2000
