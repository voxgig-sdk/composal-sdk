$kind: http-request
id: ee17b2cf-2999-57b3-a9ee-fc79a9a0810e
description: |-
  The `list` operation of **app_location**.

  SDK: `client.AppLocation().list({ app_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/locations"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_location belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["locations"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("app_location_id")) pm.collectionVariables.set("app_location_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
