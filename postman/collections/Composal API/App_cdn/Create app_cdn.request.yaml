$kind: http-request
id: cc1d460b-004c-5ad5-a857-c0d177eb9ffc
description: |-
  The `create` operation of **app_cdn**.

  SDK: `client.AppCdn().create({ app_id: "example", name: "example", origin_url: "example", slug: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/cdns"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_cdn belongs to.
body:
  type: json
  content: |-
    {
      "app_environment_id": "{{app_environment_id}}",
      "app_service_id": "{{app_service_id}}",
      "slug": "example",
      "name": "example",
      "distribution_kind": "pull_zone",
      "status": "draft",
      "origin_url": "https://example.com",
      "cache_path_prefix": "example",
      "cache_settings_json": "example",
      "security_settings_json": "example",
      "routing_settings_json": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["cdn"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("app_cdn_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
