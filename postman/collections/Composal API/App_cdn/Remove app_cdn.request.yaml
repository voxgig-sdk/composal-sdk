$kind: http-request
id: e1a0eba9-bb64-541e-845f-3ed7e2ead156
description: |-
  The `remove` operation of **app_cdn**.

  SDK: `client.AppCdn().remove({ app_id: "example", id: "example_id" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/cdns/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_cdn belongs to.
  - key: id
    value: "{{app_cdn_id}}"
    description: The app_cdn this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("app_cdn_id")
      }
    language: text/javascript
order: 12000
