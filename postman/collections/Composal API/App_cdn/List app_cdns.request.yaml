$kind: http-request
id: a5d294ca-ac23-58ff-9d8b-2f4f38b1fdfa
description: |-
  The `list` operation of **app_cdn**.

  SDK: `client.AppCdn().list({ app_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/cdns"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_cdn belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("app_cdn_id")) pm.collectionVariables.set("app_cdn_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
