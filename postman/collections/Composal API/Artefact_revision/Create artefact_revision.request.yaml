$kind: http-request
id: "132b560c-44eb-58aa-b21f-c969326b8333"
description: |-
  The `create` operation of **artefact_revision**.

  SDK: `client.ArtefactRevision().create({ artefact_id: "example", organization_id: "example", base_version: 1, content: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/artefacts/:artefact_ref/revisions"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this artefact_revision belongs to.
  - key: artefact_ref
    value: "{{artefact_id}}"
    description: The artefact this artefact_revision belongs to.
body:
  type: json
  content: |-
    {
      "content": "example",
      "base_version": 1
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["artefact"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("artefact_revision_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
