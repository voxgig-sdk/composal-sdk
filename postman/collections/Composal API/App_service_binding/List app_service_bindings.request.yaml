$kind: http-request
id: e85cb95c-34b7-5cba-b486-bab202ce455b
description: |-
  The `list` operation of **app_service_binding**.

  SDK: `client.AppServiceBinding().list({ app_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/service_bindings"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_service_binding belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("app_service_binding_id")) pm.collectionVariables.set("app_service_binding_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
