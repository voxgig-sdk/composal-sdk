$kind: http-request
id: "01d51347-5eec-5709-b101-1d3d698cfdff"
description: |-
  The `remove` operation of **app_service_binding**.

  SDK: `client.AppServiceBinding().remove({ app_id: "example", id: "example_id" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/service_bindings/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_service_binding belongs to.
  - key: id
    value: "{{app_service_binding_id}}"
    description: The app_service_binding this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("app_service_binding_id")
      }
    language: text/javascript
order: 8000
