$kind: http-request
id: "296bdec8-f7ce-5695-9e8d-5868a5302d9c"
description: |-
  The `create` operation of **app_service_binding**.

  SDK: `client.AppServiceBinding().create({ app_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/service_bindings"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_service_binding belongs to.
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("app_service_binding_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
