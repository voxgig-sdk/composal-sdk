$kind: http-request
id: "7a4486f6-b463-5260-b5c7-f31a724f2234"
description: |-
  The `load` operation of **vc_change**.

  SDK: `client.VcChange().load({ id: "example_id", organization_id: "example", repo_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/vcs/changes/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this vc_change belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this vc_change belongs to.
  - key: id
    value: "{{vc_change_id}}"
    description: The vc_change this request addresses.
order: 2000
