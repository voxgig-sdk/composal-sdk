  SDK: `client.VcChange().update({ "organization_id": "organization_id", "repo_id": "repo_id", "id": "ID", $action: "description" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/vcs/changes/:id/description"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
