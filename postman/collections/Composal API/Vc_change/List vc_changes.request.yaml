$kind: http-request
id: "9f593996-5fbf-5b74-be75-7298186b6a6f"
description: |-
  The `list` operation of **vc_change**.

  SDK: `client.VcChange().list({ organization_id: "example", repo_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/vcs/changes"
