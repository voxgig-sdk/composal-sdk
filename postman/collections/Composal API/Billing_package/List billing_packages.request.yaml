$kind: http-request
id: a67fd03b-869a-559a-a11f-e8334064958f
description: |-
  The `list` operation of **billing_package**.

  SDK: `client.BillingPackage().list()`
url: "{{base}}/api/v1/billing/packages"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["packages"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("billing_package_id")) pm.collectionVariables.set("billing_package_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
