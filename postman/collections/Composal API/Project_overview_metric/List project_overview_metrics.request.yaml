$kind: http-request
id: aeb655a8-ea22-5e91-8271-3d5f064eb4a8
description: |-
  The `list` operation of **project_overview_metric**.

  SDK: `client.ProjectOverviewMetric().list({ organization_id: "example", project_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/verification/projects/:project_id/pages/overview_metrics"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this project_overview_metric belongs to.
  - key: project_id
    value: "{{project_id}}"
    description: The project this project_overview_metric belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["counts"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("project_overview_metric_id")) pm.collectionVariables.set("project_overview_metric_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
