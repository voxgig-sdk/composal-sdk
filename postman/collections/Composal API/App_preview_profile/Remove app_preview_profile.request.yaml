$kind: http-request
id: "53ecc129-a14b-55bf-9a5c-27d74ae2a2b5"
description: |-
  The `remove` operation of **app_preview_profile**.

  SDK: `client.AppPreviewProfile().remove({ app_id: "example", id: "example_id" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/preview_profiles/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_preview_profile belongs to.
  - key: id
    value: "{{app_preview_profile_id}}"
    description: The app_preview_profile this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("app_preview_profile_id")
      }
    language: text/javascript
order: 6000
