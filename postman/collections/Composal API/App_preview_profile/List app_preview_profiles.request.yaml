$kind: http-request
id: "5d4e6a06-2621-57f3-a214-5b6317c2a2cc"
description: |-
  The `list` operation of **app_preview_profile**.

  SDK: `client.AppPreviewProfile().list({ app_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/preview_profiles"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_preview_profile belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("app_preview_profile_id")) pm.collectionVariables.set("app_preview_profile_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
