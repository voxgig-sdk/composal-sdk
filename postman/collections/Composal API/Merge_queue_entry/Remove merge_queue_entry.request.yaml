$kind: http-request
id: "926897e6-7024-57de-be6c-5b800be5914c"
description: |-
  The `remove` operation of **merge_queue_entry**.

  SDK: `client.MergeQueueEntry().remove({ id: "example_id", merge_queue_id: "example", organization_id: "example", repo_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/vcs/merge_queues/:target/entries/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this merge_queue_entry belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this merge_queue_entry belongs to.
  - key: target
    value: "{{merge_queue_id}}"
    description: "Input: merge_queue_id."
  - key: id
    value: "{{merge_queue_entry_id}}"
    description: The merge_queue_entry this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("merge_queue_entry_id")
      }
    language: text/javascript
order: 7000
