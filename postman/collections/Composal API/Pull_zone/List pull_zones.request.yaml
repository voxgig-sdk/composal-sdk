$kind: http-request
id: ca31a6ac-64c7-5197-8965-743956005f6f
description: |-
  The `list` operation of **pull_zone**.

  SDK: `client.PullZone().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/pages/pull_zones"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: app
    value: ""
    disabled: true
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this pull_zone belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["apps"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("pull_zone_id")) pm.collectionVariables.set("pull_zone_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
