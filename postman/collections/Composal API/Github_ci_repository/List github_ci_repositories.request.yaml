  SDK: `client.GithubCiRepository().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/github_ci_repositories"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: adoption_mode
    value: ""
