$kind: http-request
id: "6039cc34-70d7-5436-99eb-d195c598c287"
description: |-
  The `create` operation of **github_ci_repository**.

  SDK: `client.GithubCiRepository().create({ organization_id: "example", github_app_installation_id: "example", github_repository_id: "example", repository_name: "example", repository_owner: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/github_ci_repositories"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this github_ci_repository belongs to.
body:
  type: json
  content: |-
    {
      "github_app_installation_id": "{{github_app_installation_id}}",
      "ci_runner_pool_id": "{{ci_runner_pool_id}}",
      "github_repository_id": "example",
      "repository_owner": "example",
      "repository_name": "example",
      "default_branch": "example",
      "status": "active",
      "adoption_mode": "shadow",
      "check_name_prefix": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("github_ci_repository_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
