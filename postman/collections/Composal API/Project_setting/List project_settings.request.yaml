$kind: http-request
id: ecedb0fa-2949-544d-bab7-6e681877c631
description: |-
  The `list` operation of **project_setting**.

  SDK: `client.ProjectSetting().list({ organization_id: "example", project_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/verification/projects/:project_id/pages/settings"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this project_setting belongs to.
  - key: project_id
    value: "{{project_id}}"
    description: The project this project_setting belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("project_setting_id")) pm.collectionVariables.set("project_setting_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
