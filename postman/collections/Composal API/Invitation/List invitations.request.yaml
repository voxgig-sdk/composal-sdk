$kind: http-request
id: "73a76585-6fe0-5c95-9dff-e20c9e00d78b"
description: |-
  The `list` operation of **invitation**.

  SDK: `client.Invitation().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/invitations"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this invitation belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["invitations"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("invitation_id")) pm.collectionVariables.set("invitation_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
