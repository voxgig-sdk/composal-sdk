$kind: http-request
id: "4eb50cc0-ebd7-500e-8943-b42f53b77a4c"
description: |-
  The `create` operation of **invitation**.

  SDK: `client.Invitation().create({ organization_id: "example", email: "example", role: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/invitations"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this invitation belongs to.
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "role": "owner"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["invitation"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("invitation_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 2000
