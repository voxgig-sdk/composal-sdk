$kind: http-request
id: "04ee96af-c262-5130-936e-3795a33d9683"
description: |-
  The `remove` operation of **invitation**.

  SDK: `client.Invitation().remove({ id: "example_id", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/invitations/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this invitation belongs to.
  - key: id
    value: "{{invitation_id}}"
    description: The invitation this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("invitation_id")
      }
    language: text/javascript
order: 3000
