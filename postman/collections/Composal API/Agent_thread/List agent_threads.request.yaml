$kind: http-request
id: "0df0bf9a-c494-5cc5-ac8a-fbb0a6a875d6"
description: |-
  The `list` operation of **agent_thread**.

  SDK: `client.AgentThread().list({ agent_id: "example", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/threads"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: archived
    value: exclude
    disabled: true
  - key: conversation_id
    value: ""
    disabled: true
  - key: cursor
    value: ""
    disabled: true
  - key: local_cursor
    value: ""
    disabled: true
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_thread belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this agent_thread belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("agent_thread_id")) pm.collectionVariables.set("agent_thread_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
