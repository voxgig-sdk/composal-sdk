$kind: http-request
id: "26b229d5-7fc3-5a4b-87aa-2e533399c8cc"
description: |-
  The `create` operation of **agent_thread**.

  SDK: `client.AgentThread().create({  })`
url: "{{base}}/api/v1/agent/threads"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("agent_thread_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
