$kind: http-request
id: c69d1660-ead1-5576-8593-2059280dd38c
description: |-
  The `create` operation of **billing_checkout_session**.

  SDK: `client.BillingCheckoutSession().create({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/billing/checkout_sessions"
method: POST
headers:
  Accept: application/json
