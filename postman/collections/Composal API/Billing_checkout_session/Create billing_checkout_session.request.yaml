body:
  type: json
  content: |-
    {
      "success_url": "example",
      "cancel_url": "example",
      "coupon_code": "example",
      "package_key": "example",
      "package_revision": 1,
      "entry_point": "onboarding"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("billing_checkout_session_id", String(at(rec, "id")))
      }
