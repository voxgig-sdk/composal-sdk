$kind: http-request
id: f01df104-ea17-5f0b-81b3-1c00ed8bf80d
description: |-
  The `create` operation of **app_run**.

  SDK: `client.AppRun().create({ image: "example" })`
url: "{{base}}/api/v1/hosting/app_runs"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "image": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("app_run_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
