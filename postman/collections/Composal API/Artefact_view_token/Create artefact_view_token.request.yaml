$kind: http-request
id: bf75a0d7-b57a-5dd6-a2b4-3718ab6a4845
description: |-
  The `create` operation of **artefact_view_token**.

  SDK: `client.ArtefactViewToken().create({ artefact_id: "example", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/artefacts/:artefact_ref/view_tokens"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this artefact_view_token belongs to.
  - key: artefact_ref
    value: "{{artefact_id}}"
    description: The artefact this artefact_view_token belongs to.
body:
  type: json
  content: |-
    {
      "organization_slug": "example",
      "version": 1,
      "file": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("artefact_view_token_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
