$kind: http-request
id: d5bd7b73-c6c5-56e3-aab9-e966e4c9bec8
description: |-
  The `list` operation of **verification_project_scenario**.

  SDK: `client.VerificationProjectScenario().list({ organization_id: "example", project_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/verification/projects/:project_id/scenarios"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this verification_project_scenario belongs to.
  - key: project_id
    value: "{{project_id}}"
    description: The project this verification_project_scenario belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["scenarios"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("verification_project_scenario_id")) pm.collectionVariables.set("verification_project_scenario_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
