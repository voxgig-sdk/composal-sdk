$kind: http-request
id: "92e0173a-ce91-595f-b200-120b74b08501"
description: |-
  The `remove` operation of **space_enrollment_token**.

  SDK: `client.SpaceEnrollmentToken().remove({ id: "example_id", space_id: "example" })`
url: "{{base}}/api/v1/networking/spaces/:space_id/enrollment_tokens/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: space_id
    value: "{{space_id}}"
    description: "Input: space_id."
  - key: id
    value: "{{space_enrollment_token_id}}"
    description: The space_enrollment_token this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("space_enrollment_token_id")
      }
    language: text/javascript
order: 7000
