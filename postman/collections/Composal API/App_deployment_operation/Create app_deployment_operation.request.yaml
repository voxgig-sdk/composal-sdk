$kind: http-request
id: ea456b2b-2663-5b5d-9fe9-71d23ac2f8fc
description: |-
  The `create` operation of **app_deployment_operation**.

  SDK: `client.AppDeploymentOperation().create({ app_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/deployment_operations"
method: POST
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_deployment_operation belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["operation"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("app_deployment_operation_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
