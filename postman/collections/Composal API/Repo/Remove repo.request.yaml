$kind: http-request
id: ccab6dd7-3409-5209-bee5-52e499f016d8
description: |-
  The `remove` operation of **repo**.

  SDK: `client.Repo().remove({ id: "example_id", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this repo belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("repo_id")
      }
    language: text/javascript
order: 4000
