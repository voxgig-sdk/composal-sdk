$kind: http-request
id: "19858434-44a9-5f6d-bd91-8624ce45d05e"
description: |-
  The `list` operation of **repo**.

  SDK: `client.Repo().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: direction
    value: asc
    disabled: true
  - key: page
    value: "1"
    disabled: true
  - key: q
    value: ""
    disabled: true
  - key: sort
    value: name
    disabled: true
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this repo belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["repos"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("repo_id")) pm.collectionVariables.set("repo_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
