$kind: http-request
id: c0d53d6f-423f-5c9e-a19f-c192c361669d
description: |-
  The `sync` action of **repo**, a route of its `load` operation.

  SDK: `client.Repo().load({ "organization_id": "organization_id", "id": "ID", $action: "sync" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/pages/sync"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this repo belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this request addresses.
order: 3000
