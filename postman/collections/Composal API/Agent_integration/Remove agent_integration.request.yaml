$kind: http-request
id: d74d9bc6-2b84-544e-af18-d81ef7fadfab
description: |-
  The `remove` operation of **agent_integration**.

  SDK: `client.AgentIntegration().remove({ id: "example_id", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agent_integrations/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_integration belongs to.
  - key: id
    value: "{{agent_integration_id}}"
    description: The agent_integration this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("agent_integration_id")
      }
    language: text/javascript
order: 13000
