$kind: http-request
id: b27ef8cc-2c76-5271-bdc7-f69cd0841555
description: |-
  The `create` operation of **agent_integration**.

  SDK: `client.AgentIntegration().create({ organization_id: "example", name: "example", toolkit: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agent_integrations"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_integration belongs to.
body:
  type: json
  content: |-
    {
      "toolkit": "example",
      "name": "example",
      "creation_key": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["connection"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("agent_integration_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
