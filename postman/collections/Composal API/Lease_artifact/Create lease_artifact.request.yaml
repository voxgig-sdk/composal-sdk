    value: "{{lease_id}}"
    description: "Input: lease_id."
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("lease_artifact_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
