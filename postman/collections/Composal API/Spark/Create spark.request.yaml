$kind: http-request
id: "26d6b2d8-8f9c-5cdd-81bd-1d927bb6e562"
description: |-
  The `create` operation of **spark**.

  SDK: `client.Spark().create({ jsonrpc: "example", method: "example" })`
url: "{{base}}/v1/mcp/spark"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "jsonrpc": "example",
      "id": "spark-{{$timestamp}}",
      "method": "example",
      "params": {}
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("spark_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 2000
