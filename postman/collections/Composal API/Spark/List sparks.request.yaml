$kind: http-request
id: "9647331a-a1e2-5379-881d-9f1989cf3510"
description: |-
  The `list` operation of **spark**.

  SDK: `client.Spark().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/sparks"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this spark belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("spark_id")) pm.collectionVariables.set("spark_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
