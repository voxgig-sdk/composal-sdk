$kind: http-request
id: "68a1b65e-4524-59b2-9086-e8a683e3d452"
description: |-
  The `create` operation of **spark**.

  SDK: `client.Spark().create({ jsonrpc: "example", method: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/sparks"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this spark belongs to.
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["organization"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("spark_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
