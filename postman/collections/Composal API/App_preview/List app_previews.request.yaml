$kind: http-request
id: "46bdd529-4ed3-5d6d-a648-7ca1633ffb93"
description: |-
  The `list` operation of **app_preview**.

  SDK: `client.AppPreview().list({ app_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/previews"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_preview belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("app_preview_id")) pm.collectionVariables.set("app_preview_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
