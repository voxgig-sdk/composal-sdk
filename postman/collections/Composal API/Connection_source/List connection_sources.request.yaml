$kind: http-request
id: eb4a74d4-ce41-5afe-bdae-761442d1d1c8
description: |-
  The `list` operation of **connection_source**.

  SDK: `client.ConnectionSource().list({ agent_id: "example", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/relay/connections/sources"
method: GET
headers:
  Accept: application/json
  X-Composal-Relay-Scope: "{{x_composal_relay_scope}}"
  X-Composal-Requester-Id: "{{x_composal_requester_id}}"
queryParams:
  - key: cursor
    value: ""
    disabled: true
  - key: limit
    value: "30"
    disabled: true
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this connection_source belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this connection_source belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["sources"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("connection_source_id")) pm.collectionVariables.set("connection_source_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
