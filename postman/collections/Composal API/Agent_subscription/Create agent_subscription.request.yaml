$kind: http-request
id: "8452dce6-1b31-5117-bc16-4757d95b037f"
description: |-
  The `create` operation of **agent_subscription**.

  SDK: `client.AgentSubscription().create({ agent_id: "example", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/subscriptions"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_subscription belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this agent_subscription belongs to.
body:
  type: json
  content: |-
    {
      "action_name": "start",
      "method": "openai/openai"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("agent_subscription_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 2000
