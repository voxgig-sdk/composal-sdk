$kind: http-request
id: "6cc9b872-bfd4-508a-94c0-ae8912e85fca"
description: |-
  The `list` operation of **agent_subscription**.

  SDK: `client.AgentSubscription().list({ agent_id: "example", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/subscriptions"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: refresh_provider
    value: ""
    disabled: true
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_subscription belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this agent_subscription belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("agent_subscription_id")) pm.collectionVariables.set("agent_subscription_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
