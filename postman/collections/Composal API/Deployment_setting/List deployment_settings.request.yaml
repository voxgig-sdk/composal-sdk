$kind: http-request
id: f22cc419-347b-5e04-8201-a2bda8b40fc6
description: |-
  The `list` operation of **deployment_setting**.

  SDK: `client.DeploymentSetting().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/pages/deployments/settings"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: app
    value: ""
    disabled: true
  - key: environment
    value: ""
    disabled: true
  - key: service
    value: ""
    disabled: true
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this deployment_setting belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["available_locations"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("deployment_setting_id")) pm.collectionVariables.set("deployment_setting_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
