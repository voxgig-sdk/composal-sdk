$kind: http-request
id: f8a48058-6ddd-567e-bde9-e1fc5f9ab30a
description: |-
  The `list` operation of **organization_oidc_trust**.

  SDK: `client.OrganizationOidcTrust().list({ organization_id: "example" })`
url: "{{base}}/api/v1/identity/organizations/:organization_id/oidc_trusts"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this organization_oidc_trust belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("organization_oidc_trust_id")) pm.collectionVariables.set("organization_oidc_trust_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
