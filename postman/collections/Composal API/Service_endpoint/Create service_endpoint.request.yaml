$kind: http-request
id: "45bfcdfa-f246-57c6-a05e-9f3dd2712b66"
description: |-
  The `create` operation of **service_endpoint**.

  SDK: `client.ServiceEndpoint().create({ app_id: "example", service_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/services/:service_id/endpoints"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this service_endpoint belongs to.
  - key: service_id
    value: "{{service_id}}"
    description: "Input: service_id."
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("service_endpoint_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
