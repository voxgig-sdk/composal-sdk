$kind: http-request
id: "49995513-10b5-51ef-bc18-e1a7c006d137"
description: |-
  The `list` operation of **service_endpoint**.

  SDK: `client.ServiceEndpoint().list({ app_id: "example", service_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/services/:service_id/endpoints"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this service_endpoint belongs to.
  - key: service_id
    value: "{{service_id}}"
    description: "Input: service_id."
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("service_endpoint_id")) pm.collectionVariables.set("service_endpoint_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
