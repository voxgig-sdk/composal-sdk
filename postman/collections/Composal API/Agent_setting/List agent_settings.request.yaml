$kind: http-request
id: f0f4dba8-85c7-58b7-9a10-539bee39a5ac
description: |-
  The `list` operation of **agent_setting**.

  SDK: `client.AgentSetting().list({ agent_id: "example", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/settings"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_setting belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this agent_setting belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("agent_setting_id")) pm.collectionVariables.set("agent_setting_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
