$kind: http-request
id: "8c4d63d3-84e7-5a41-b241-166e0dc19b40"
description: |-
  The `list` operation of **agent_teammate**.

  SDK: `client.AgentTeammate().list({ agent_id: "example", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/teammates"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: q
    value: ""
    disabled: true
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_teammate belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this agent_teammate belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["agents"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("agent_teammate_id")) pm.collectionVariables.set("agent_teammate_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
