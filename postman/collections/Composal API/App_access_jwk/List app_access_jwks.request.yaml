$kind: http-request
id: "561b77d3-2b9b-5782-aad0-ba867b89df8f"
description: |-
  The `list` operation of **app_access_jwk**.

  SDK: `client.AppAccessJwk().list()`
url: "{{base}}/api/v1/app_access/jwks"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("app_access_jwk_id")) pm.collectionVariables.set("app_access_jwk_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
