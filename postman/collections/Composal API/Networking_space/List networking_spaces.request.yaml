$kind: http-request
id: "170d5a93-5ebb-5797-9ba9-b66449f6fb07"
description: |-
  The `list` operation of **networking_space**.

  SDK: `client.NetworkingSpace().list()`
url: "{{base}}/api/v1/networking/spaces"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("networking_space_id")) pm.collectionVariables.set("networking_space_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
