$kind: http-request
id: "524e7e1d-a13d-5c8c-abe5-59f27255f38d"
description: |-
  The `remove` operation of **device_project**.

  SDK: `client.DeviceProject().remove({ device_id: "example", id: "example_id", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/devices/:device_registration_id/projects/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this device_project belongs to.
  - key: device_registration_id
    value: "{{device_id}}"
    description: The device this device_project belongs to.
  - key: id
    value: "{{device_project_id}}"
    description: The device_project this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("device_project_id")
      }
    language: text/javascript
order: 1000
