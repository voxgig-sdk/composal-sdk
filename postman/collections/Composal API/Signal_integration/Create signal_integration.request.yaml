$kind: http-request
id: "430f7e6e-4bb9-580d-b18d-de5ad3b5639d"
description: |-
  The `create` operation of **signal_integration**.

  SDK: `client.SignalIntegration().create({ organization_id: "example", name: "example", provider: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/signal_integrations"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this signal_integration belongs to.
body:
  type: json
  content: |-
    {
      "provider": "sentry",
      "mode": "connected",
      "name": "example",
      "webhook_secret": "example",
      "api_token": "example",
      "config": {}
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["signal_integration"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("signal_integration_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
