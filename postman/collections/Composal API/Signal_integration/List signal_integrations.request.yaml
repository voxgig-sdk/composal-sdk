$kind: http-request
id: "7efe3747-cbb9-58c7-bf63-23b9a96e93f2"
description: |-
  The `list` operation of **signal_integration**.

  SDK: `client.SignalIntegration().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/signal_integrations"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this signal_integration belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["signal_integrations"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("signal_integration_id")) pm.collectionVariables.set("signal_integration_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
