$kind: http-request
id: fa5054a5-2b3b-5261-8b1b-9034cc188255
description: |-
  The `list` operation of **me_email**.

  SDK: `client.MeEmail().list()`
url: "{{base}}/api/v1/me/emails"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["emails"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("me_email_id")) pm.collectionVariables.set("me_email_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
