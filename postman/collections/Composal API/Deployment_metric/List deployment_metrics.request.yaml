$kind: http-request
id: "16949ed4-7cee-58d1-80bf-bcd45cd5d60a"
description: |-
  The `list` operation of **deployment_metric**.

  SDK: `client.DeploymentMetric().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/pages/deployments/metrics"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: app
    value: ""
    disabled: true
  - key: environment
    value: ""
    disabled: true
  - key: metrics_range
    value: ""
    disabled: true
  - key: service
    value: ""
    disabled: true
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this deployment_metric belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["deploy_targets"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("deployment_metric_id")) pm.collectionVariables.set("deployment_metric_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
