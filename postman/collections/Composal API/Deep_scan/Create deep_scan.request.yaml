$kind: http-request
id: "5664ce25-bb18-56a3-a710-d97d842e12eb"
description: |-
  The `create` operation of **deep_scan**.

  SDK: `client.DeepScan().create({ organization_id: "example", environment_id: "example", goal: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/verify/deep_scans"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
queryParams:
  - key: project_id
    value: ""
    disabled: true
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this deep_scan belongs to.
body:
  type: json
  content: |-
    {
      "environment_id": "{{environment_id}}",
      "account_id": "example",
      "goal": "example",
      "max_seconds": 14400,
      "max_testers": 40,
      "concurrency": 20,
      "idempotency_key": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("deep_scan_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
