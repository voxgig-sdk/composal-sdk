$kind: http-request
id: c264b90f-460f-5d4b-b389-1a1f19d003ea
description: |-
  The `list` operation of **deep_scan**.

  SDK: `client.DeepScan().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/verify/deep_scans"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: findings
    value: ""
    disabled: true
  - key: page
    value: ""
    disabled: true
  - key: project_id
    value: ""
    disabled: true
  - key: query
    value: ""
    disabled: true
  - key: status
    value: ""
    disabled: true
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this deep_scan belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["active"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("deep_scan_id")) pm.collectionVariables.set("deep_scan_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
