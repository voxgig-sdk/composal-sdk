$kind: http-request
id: a0c70514-c28d-5114-8986-a64d3833e40d
description: |-
  The `list` operation of **space_log_stream**.

  SDK: `client.SpaceLogStream().list({ space_id: "example" })`
url: "{{base}}/api/v1/observability/spaces/:space_id/log_streams"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: space_id
    value: "{{space_id}}"
    description: "Input: space_id."
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("space_log_stream_id")) pm.collectionVariables.set("space_log_stream_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
