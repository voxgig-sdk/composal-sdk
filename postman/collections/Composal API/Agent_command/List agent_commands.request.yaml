$kind: http-request
id: ccad1189-9754-5c79-b5e4-76e03359cd03
description: |-
  The `list` operation of **agent_command**.

  SDK: `client.AgentCommand().list({ agent_id: "example", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/commands"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: conversation_id
    value: main
    disabled: true
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_command belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this agent_command belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["commands"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("agent_command_id")) pm.collectionVariables.set("agent_command_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
