$kind: http-request
id: ecc11280-d775-529d-9ff6-4a4ce8e37132
description: |-
  The `list` operation of **slack_channel**.

  SDK: `client.SlackChannel().list({ agent_id: "example", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/slack/channels"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: cursor
    value: ""
    disabled: true
  - key: kind
    value: ""
    disabled: true
  - key: q
    value: ""
    disabled: true
  - key: refresh
    value: ""
    disabled: true
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this slack_channel belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this slack_channel belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["channels"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("slack_channel_id")) pm.collectionVariables.set("slack_channel_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
