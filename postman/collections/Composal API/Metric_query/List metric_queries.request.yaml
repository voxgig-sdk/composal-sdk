$kind: http-request
id: bd3df4d1-a1a7-5074-a3dc-56b8efff5073
description: |-
  The `list` operation of **metric_query**.

  SDK: `client.MetricQuery().list()`
url: "{{base}}/api/v1/hosting/metrics/queries"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("metric_query_id")) pm.collectionVariables.set("metric_query_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
