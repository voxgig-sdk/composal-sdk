$kind: http-request
id: f0790265-3f83-5d54-b1e9-c40a38a82935
description: |-
  The `list` operation of **memory**.

  SDK: `client.Memory().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/verify/memories"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: environment_id
    value: ""
    disabled: true
  - key: include_environments
    value: ""
    disabled: true
  - key: project_id
    value: ""
    disabled: true
  - key: q
    value: ""
    disabled: true
  - key: tag
    value: ""
    disabled: true
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this memory belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["memories"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("memory_id")) pm.collectionVariables.set("memory_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
