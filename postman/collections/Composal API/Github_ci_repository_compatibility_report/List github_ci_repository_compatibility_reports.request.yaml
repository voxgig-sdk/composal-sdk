  - key: github_ci_repository_id
    value: "{{github_ci_repository_id}}"
    description: The github_ci_repository this github_ci_repository_compatibility_report belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["ci_workflow_compatibility_reports"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("github_ci_repository_compatibility_report_id")) pm.collectionVariables.set("github_ci_repository_compatibility_report_id", String(at(rec, "id")))
      }
