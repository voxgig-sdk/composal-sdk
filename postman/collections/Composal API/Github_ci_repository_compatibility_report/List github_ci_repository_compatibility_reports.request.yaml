  SDK: `client.GithubCiRepositoryCompatibilityReport().list({ github_ci_repository_id: "example", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/github_ci_repositories/:github_ci_repository_id/compatibility_reports"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: event_name
