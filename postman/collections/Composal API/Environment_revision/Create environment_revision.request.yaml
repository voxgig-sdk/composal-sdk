body:
  type: json
  content: |-
    {
      "blueprint": {},
      "source_metadata": {},
      "dry_run": true
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("environment_revision_id", String(at(rec, "id")))
      }
    language: text/javascript
