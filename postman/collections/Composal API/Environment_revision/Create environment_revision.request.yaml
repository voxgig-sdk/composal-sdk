$kind: http-request
id: efee4c85-00cb-597c-9dc0-382e7d01d9d3
description: |-
  The `create` operation of **environment_revision**.

  SDK: `client.EnvironmentRevision().create({ environment_id: "example", organization_id: "example", blueprint: {} })`
url: "{{base}}/api/v1/organizations/:organization_id/verify/environments/:verify_environment_id/revisions"
method: POST
headers:
