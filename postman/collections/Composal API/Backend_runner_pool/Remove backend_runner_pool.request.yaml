$kind: http-request
id: "3bc8c2c9-0350-5761-a1e6-d9f693a133a2"
description: |-
  The `remove` operation of **backend_runner_pool**.

  SDK: `client.BackendRunnerPool().remove({ backend_id: "example", id: "example" })`
url: "{{base}}/api/v1/bazel/backends/:backend_id/runner_pools/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: backend_id
    value: "{{backend_id}}"
    description: "Input: backend_id."
  - key: id
    value: "{{backend_runner_pool_id}}"
    description: The backend_runner_pool this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("backend_runner_pool_id")
      }
    language: text/javascript
order: 3000
