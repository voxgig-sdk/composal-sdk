$kind: http-request
id: dbfd08f4-e35c-5873-91d1-d906dc57c6c9
description: |-
  The `create` operation of **tool_feedback**.

  SDK: `client.ToolFeedback().create({ organization_id: "example", feedback: {} })`
url: "{{base}}/api/v1/organizations/:organization_id/tool_feedbacks"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Idempotency-Key: "{{idempotency_key}}"
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this tool_feedback belongs to.
body:
  type: json
  content: |-
    {
      "feedback": {
        "category": "bug",
        "source": "cli",
        "summary": "example",
        "details": "example",
        "metadata": {
          "session_id": "example",
          "harness": "example",
          "model": "example",
          "client_version": "example",
          "platform": "example",
          "tool_name": "example",
          "command": "example",
          "run_id": "example"
        }
      }
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("tool_feedback_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 2000
