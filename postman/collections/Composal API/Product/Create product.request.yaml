$kind: http-request
id: "71fac464-37ef-59a5-925f-ba002989dee8"
description: |-
  The `create` operation of **product**.

  SDK: `client.Product().create({ organization_id: "example", product: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/products"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this product belongs to.
body:
  type: json
  content: |-
    {
      "product": "transcripts"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["organization"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("product_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
