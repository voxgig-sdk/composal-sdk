$kind: http-request
id: "4e450fb2-3563-5a39-9d58-486e92419ce7"
description: |-
  The `create` operation of **vc_branch**.

  SDK: `client.VcBranch().create({ organization_id: "example", repo_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/vcs/branches"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this vc_branch belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this vc_branch belongs to.
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("vc_branch_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 2000
