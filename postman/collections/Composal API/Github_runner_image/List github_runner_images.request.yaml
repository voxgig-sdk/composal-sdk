$kind: http-request
id: "4a7d1671-ee50-5fd9-ab38-1f5cc0c8868c"
description: |-
  The `list` operation of **github_runner_image**.

  SDK: `client.GithubRunnerImage().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/github_runner_images"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this github_runner_image belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["github_runner_images"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("github_runner_image_id")) pm.collectionVariables.set("github_runner_image_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
