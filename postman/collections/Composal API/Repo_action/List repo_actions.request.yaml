$kind: http-request
id: d4a8d4fd-218f-5323-a027-d78295f86f7a
description: |-
  The `list` operation of **repo_action**.

  SDK: `client.RepoAction().list({ organization_id: "example", repo_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/pages/actions"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: pipeline_id
    value: ""
    disabled: true
  - key: range
    value: ""
    disabled: true
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this repo_action belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this repo_action belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["action_runs"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("repo_action_id")) pm.collectionVariables.set("repo_action_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
