$kind: http-request
id: "956cead5-d63c-5adf-a899-24eba8ea7f7e"
description: |-
  The `list` operation of **agent_repository**.

  SDK: `client.AgentRepository().list({ agent_id: "example", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/repositories"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: q
    value: ""
    disabled: true
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_repository belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this agent_repository belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("agent_repository_id")) pm.collectionVariables.set("agent_repository_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
