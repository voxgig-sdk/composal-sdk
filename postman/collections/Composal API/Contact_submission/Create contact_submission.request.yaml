$kind: http-request
id: "3fa5b631-0bcb-5135-b6cf-f08585e3f2f6"
description: |-
  The `create` operation of **contact_submission**.

  SDK: `client.ContactSubmission().create({ email: "example", message: "example", name: "example" })`
url: "{{base}}/api/v1/contact_submissions"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "example",
      "email": "example",
      "company": "example",
      "message": "example",
      "website": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("contact_submission_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
