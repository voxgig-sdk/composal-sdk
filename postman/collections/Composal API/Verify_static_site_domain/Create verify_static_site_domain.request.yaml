$kind: http-request
id: "7d233d51-fa62-5c35-aac2-38ac4e8386a6"
description: |-
  The `create` operation of **verify_static_site_domain**.

  SDK: `client.VerifyStaticSiteDomain().create({ id: "example", static_site_id: "example" })`
url: "{{base}}/api/v1/static_sites/:static_site_id/domains/:id/verify"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: static_site_id
    value: "{{static_site_id}}"
