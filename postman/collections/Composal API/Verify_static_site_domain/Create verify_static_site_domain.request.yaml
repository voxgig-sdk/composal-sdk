  - key: id
    value: "{{verify_static_site_domain_id}}"
    description: The verify_static_site_domain this request addresses.
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["domain"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("verify_static_site_domain_id", String(at(rec, "id")))
      }
    language: text/javascript
