$kind: http-request
id: ff44931f-7c43-5f43-a196-088c5df91cbf
description: |-
  The `create` operation of **thread_preview**.

  SDK: `client.ThreadPreview().create({ agent_id: "example", organization_id: "example", thread_id: "example", port: 1 })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/threads/:thread_id/previews"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this thread_preview belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this thread_preview belongs to.
  - key: thread_id
    value: "{{thread_id}}"
    description: "Input: thread_id."
body:
  type: json
  content: |-
    {
      "port": 1
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("thread_preview_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
