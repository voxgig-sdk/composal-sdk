$kind: http-request
id: "80ed75b1-c7b8-5e02-bf97-a39d0712dca8"
description: |-
  The `remove` operation of **agent_marketplace**.

  SDK: `client.AgentMarketplace().remove({ id: "example_id", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agent_marketplace/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_marketplace belongs to.
  - key: id
    value: "{{agent_marketplace_id}}"
    description: The agent_marketplace this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("agent_marketplace_id")
      }
    language: text/javascript
order: 10000
