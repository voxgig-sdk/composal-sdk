$kind: http-request
id: "0423af3a-5bde-59eb-a0c0-bef30fb61d80"
description: |-
  The `remove` operation of **environment**.

  SDK: `client.Environment().remove({ id: "example_id", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/verify/environments/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this environment belongs to.
  - key: id
    value: "{{environment_id}}"
    description: The environment this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("environment_id")
      }
    language: text/javascript
order: 7000
