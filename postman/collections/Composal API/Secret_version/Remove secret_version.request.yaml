$kind: http-request
id: "840f1d6c-2eff-5805-b7ee-d32a9e95cd14"
description: |-
  The `remove` operation of **secret_version**.

  SDK: `client.SecretVersion().remove({ id: "example_id", organization_id: "example", secret_id: "example" })`
url: "{{base}}/api/v1/identity/organizations/:organization_id/secrets/:secret_id/versions/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this secret_version belongs to.
  - key: secret_id
    value: "{{secret_id}}"
    description: "Input: secret_id."
  - key: id
    value: "{{secret_version_id}}"
    description: The secret_version this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("secret_version_id")
      }
    language: text/javascript
order: 8000
