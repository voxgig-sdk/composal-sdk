$kind: http-request
id: "0034fba4-eff6-56f5-a33f-6ea36dd90d06"
description: |-
  The `remove` operation of **agent**.

  SDK: `client.Agent().remove({ id: "example_id", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("agent_id")
      }
    language: text/javascript
order: 43000
