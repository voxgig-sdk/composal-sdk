$kind: http-request
id: "30085173-137e-55e0-a869-89e83849c994"
description: |-
  The `create` operation of **agent**.

  SDK: `client.Agent().create({ organization_id: "example", name: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Idempotency-Key: "{{idempotency_key}}"
queryParams:
  - key: viewer_time_zone
    value: ""
    disabled: true
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent belongs to.
body:
  type: json
  content: |-
    {
      "runtime_version": "v2",
      "visibility": "private",
      "name": "example",
      "slug": "example",
      "configuration": {
        "instructions": "example",
        "model_policy": {
          "mode": "platform_default"
        },
        "work_repositories": [
          {
            "repository_id": "example",
            "permission": "read",
            "write_branches": [
              "example"
            ],
            "exclude_default_branch": true
          }
        ],
        "connection_grants": [
          "example"
        ]
      }
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["agent"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("agent_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
