$kind: http-request
id: "13451f0b-ed7d-5115-a38c-3a80c9560085"
description: |-
  The `list` operation of **spark_credit_usage_total**.

  SDK: `client.SparkCreditUsageTotal().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/spark_credits/usage_totals"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this spark_credit_usage_total belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("spark_credit_usage_total_id")) pm.collectionVariables.set("spark_credit_usage_total_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
