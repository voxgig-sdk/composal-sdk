$kind: http-request
id: "84ac252c-2ed0-55ec-b39c-40bed1aa81ee"
description: |-
  The `list` operation of **browser_egress_candidate**.

  SDK: `client.BrowserEgressCandidate().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/browser_egress/candidates"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: cursor
    value: ""
    disabled: true
  - key: limit
    value: "30"
    disabled: true
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this browser_egress_candidate belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["agents"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("browser_egress_candidate_id")) pm.collectionVariables.set("browser_egress_candidate_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
