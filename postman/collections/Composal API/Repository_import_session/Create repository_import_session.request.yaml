$kind: http-request
id: "2968363a-7d45-5eb2-86a3-0ca209a32137"
description: |-
  The `create` operation of **repository_import_session**.

  SDK: `client.RepositoryImportSession().create({ organization_id: "example", idempotency_key: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/repository_import_sessions"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this repository_import_session belongs to.
body:
  type: json
  content: |-
    {
      "idempotency_key": "example",
      "github_app_installation_id": "{{github_app_installation_id}}",
      "client_name": "example",
      "client_version": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("repository_import_session_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 2000
