$kind: http-request
id: dca8d7b3-2870-5aca-9de4-221e5c9deb99
description: |-
  The `list` operation of **change_comment**.

  SDK: `client.ChangeComment().list({ change_id: "example", organization_id: "example", repo_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/vcs/changes/:id/comments"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: path
    value: ""
    disabled: true
  - key: resolved
    value: ""
    disabled: true
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this change_comment belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this change_comment belongs to.
  - key: id
    value: "{{change_id}}"
    description: The change this change_comment belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["comments"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("change_comment_id")) pm.collectionVariables.set("change_comment_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
