$kind: http-request
id: "224e94d9-ae53-586b-8b41-5499c34a8d21"
description: |-
  The `remove` operation of **space_group**.

  SDK: `client.SpaceGroup().remove({ id: "example", space_id: "example" })`
url: "{{base}}/api/v1/networking/spaces/:space_id/groups/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: space_id
    value: "{{space_id}}"
    description: "Input: space_id."
  - key: id
    value: "{{space_group_id}}"
    description: The space_group this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("space_group_id")
      }
    language: text/javascript
order: 5000
