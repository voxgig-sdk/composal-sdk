$kind: http-request
id: af2650a5-fae0-5fd4-8fab-5e32bbee27ab
description: |-
  The `remove` operation of **cdn_space_object**.

  SDK: `client.CdnSpaceObject().remove({ cdn_space_id: "example", id: "example_id" })`
url: "{{base}}/api/v1/cdn_spaces/:cdn_space_id/objects/:path"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: cdn_space_id
    value: "{{cdn_space_id}}"
    description: The cdn_space this cdn_space_object belongs to.
  - key: path
    value: "{{cdn_space_object_id}}"
    description: The cdn_space_object this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("cdn_space_object_id")
      }
    language: text/javascript
order: 4000
