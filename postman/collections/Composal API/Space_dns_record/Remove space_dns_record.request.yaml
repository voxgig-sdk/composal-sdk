$kind: http-request
id: c989b7e0-885f-5ec4-9758-e6190743a490
description: |-
  The `remove` operation of **space_dns_record**.

  SDK: `client.SpaceDnsRecord().remove({ id: "example_id", space_id: "example" })`
url: "{{base}}/api/v1/networking/spaces/:space_id/dns_records/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: space_id
    value: "{{space_id}}"
    description: "Input: space_id."
  - key: id
    value: "{{space_dns_record_id}}"
    description: The space_dns_record this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("space_dns_record_id")
      }
    language: text/javascript
order: 8000
