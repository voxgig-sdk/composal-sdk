$kind: http-request
id: "46b4b0e9-ba14-5aa1-b543-883d79eb2ba5"
description: |-
  The `list` operation of **vc_file**.

  SDK: `client.VcFile().list({ organization_id: "example", repo_id: "example", ref: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/vcs/files?ref={{ref}}"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: prefix
    value: ""
    disabled: true
  - key: ref
    value: "{{ref}}"
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this vc_file belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this vc_file belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["paths"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("vc_file_id")) pm.collectionVariables.set("vc_file_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
