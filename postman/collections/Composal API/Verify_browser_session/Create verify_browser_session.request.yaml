$kind: http-request
id: "6d03d529-5efe-5ae0-850a-c3d2a667174d"
description: |-
  The `create` operation of **verify_browser_session**.

  SDK: `client.VerifyBrowserSession().create({ organization_id: "example", project_id: "example", url: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/verify/browser_sessions"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this verify_browser_session belongs to.
body:
  type: json
  content: |-
    {
      "account_id": "example",
      "name": "example",
      "project_id": "{{project_id}}",
      "url": "https://example.com"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("verify_browser_session_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 2000
