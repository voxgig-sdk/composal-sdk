$kind: http-request
id: e35b8e11-ea36-55cd-b3c7-1d20c6451b73
description: |-
  The `list` operation of **app_service_placement**.

  SDK: `client.AppServicePlacement().list({ app_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/service_placements"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: existing
    value: ""
    disabled: true
  - key: service
    value: ""
    disabled: true
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this app_service_placement belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["placements"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("app_service_placement_id")) pm.collectionVariables.set("app_service_placement_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
