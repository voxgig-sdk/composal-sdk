$kind: http-request
id: f1e5fcb4-b2bd-5764-9d40-e6e557333d74
description: |-
  The `create` operation of **network_connection**.

  SDK: `client.NetworkConnection().create({ organization_id: "example", name: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/verify/network_connections"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this network_connection belongs to.
body:
  type: json
  content: |-
    {
      "name": "example",
      "provider": "tailscale",
      "oauth_client_id": "example",
      "oauth_client_secret": "example",
      "aws_client_vpn_profile": "example",
      "device_tag": "example",
      "status": "active"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("network_connection_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
