$kind: http-request
id: "1f80b77e-a0e6-55bb-be5f-add5bb3bfcee"
description: |-
  The `create` operation of **static_site_domain**.

  SDK: `client.StaticSiteDomain().create({ static_site_id: "example", hostname: "example" })`
url: "{{base}}/api/v1/static_sites/:static_site_id/domains"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: static_site_id
    value: "{{static_site_id}}"
    description: The static_site this static_site_domain belongs to.
body:
  type: json
  content: |-
    {
      "hostname": "example",
      "kind": "primary",
      "dns_mode": "manual_cname",
      "redirect_to": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["domain"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("static_site_domain_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
