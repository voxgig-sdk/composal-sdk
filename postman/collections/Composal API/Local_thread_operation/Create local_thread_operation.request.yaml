$kind: http-request
id: "388d0377-b92f-53c8-85a9-9de41486ecb7"
description: |-
  The `create` operation of **local_thread_operation**.

  SDK: `client.LocalThreadOperation().create({ agent_id: "example", local_thread_id: "example", organization_id: "example", action: "example", arguments: {}, key: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/local_threads/:local_thread_id/operations"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
