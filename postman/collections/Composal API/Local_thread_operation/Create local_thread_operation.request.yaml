  - key: local_thread_id
    value: "{{local_thread_id}}"
    description: "Input: local_thread_id."
body:
  type: json
  content: |-
    {
      "key": "example",
      "action": "threads.read",
      "arguments": {}
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["operation"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("local_thread_operation_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
