$kind: http-request
id: a064af26-bf31-54a4-a0f3-994fc2ea7757
description: |-
  The `list` operation of **repo_agent_session**.

  SDK: `client.RepoAgentSession().list({ organization_id: "example", repo_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/agent_sessions"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this repo_agent_session belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this repo_agent_session belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("repo_agent_session_id")) pm.collectionVariables.set("repo_agent_session_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
