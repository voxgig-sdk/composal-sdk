$kind: http-request
id: "092df269-d046-5b16-b563-e4ebb7084309"
description: |-
  The `create` operation of **repo_agent_session**.

  SDK: `client.RepoAgentSession().create({ organization_id: "example", repo_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/agent_sessions"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this repo_agent_session belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this repo_agent_session belongs to.
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("repo_agent_session_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
