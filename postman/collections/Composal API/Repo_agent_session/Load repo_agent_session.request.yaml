$kind: http-request
id: "5ab40abc-03b8-5bcb-8d4f-fd83683bf38f"
description: |-
  The `load` operation of **repo_agent_session**.

  SDK: `client.RepoAgentSession().load({ organization_id: "example", repo_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/agent_sessions/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this repo_agent_session belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this repo_agent_session belongs to.
  - key: id
    value: "{{repo_agent_session_id}}"
    description: The repo_agent_session this request addresses.
order: 1000
