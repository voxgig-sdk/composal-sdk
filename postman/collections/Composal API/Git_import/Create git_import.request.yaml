$kind: http-request
id: f765b1a2-ff89-571c-8bb2-5748cb8d82a0
description: |-
  The `create` operation of **git_import**.

  SDK: `client.GitImport().create({ organization_id: "example", destination_mode: "example", idempotency_key: "example", root_path: "example", slug: "example", source_branch: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/git_imports"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this git_import belongs to.
body:
  type: json
  content: |-
    {
      "idempotency_key": "example",
      "slug": "example",
      "name": "example",
      "root_path": "example",
      "source_branch": "example",
      "target_branch": "example",
      "destination_mode": "standalone",
      "git_default_branch": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("git_import_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 2000
