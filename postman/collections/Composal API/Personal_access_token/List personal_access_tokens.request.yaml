$kind: http-request
id: e50bbbf0-ac54-5919-a55d-e3160ba109d2
description: |-
  The `list` operation of **personal_access_token**.

  SDK: `client.PersonalAccessToken().list()`
url: "{{base}}/api/v1/personal_access_tokens"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("personal_access_token_id")) pm.collectionVariables.set("personal_access_token_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
