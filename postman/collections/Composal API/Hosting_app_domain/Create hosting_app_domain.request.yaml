$kind: http-request
id: ff7ab2ca-c22c-5b49-a736-6941d0f547c3
description: |-
  The `create` operation of **hosting_app_domain**.

  SDK: `client.HostingAppDomain().create({ app_id: "example", app_service_id: "example", hostname: "example", kind: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/domains"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this hosting_app_domain belongs to.
body:
  type: json
  content: |-
    {
      "app_service_id": "{{app_service_id}}",
      "app_environment_id": "{{app_environment_id}}",
      "hostname": "example",
      "kind": "primary",
      "tls_status": "pending",
      "dns_status": "pending",
      "redirect_to": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["domain"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("hosting_app_domain_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
