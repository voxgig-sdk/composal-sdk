$kind: http-request
id: a5095053-0786-52a8-bf6e-20d8c37ce236
description: |-
  The `remove` operation of **hosting_app_domain**.

  SDK: `client.HostingAppDomain().remove({ app_id: "example", id: "example_id" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/domains/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this hosting_app_domain belongs to.
  - key: id
    value: "{{hosting_app_domain_id}}"
    description: The hosting_app_domain this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("hosting_app_domain_id")
      }
    language: text/javascript
order: 8000
