$kind: http-request
id: ee9bc15b-5730-5d64-871c-4d701be7c9a7
description: |-
  The `list` operation of **binary_version**.

  SDK: `client.BinaryVersion().list({ binary_id: "example", organization_id: "example", project_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/verify/binaries/:binary_id/versions?project_id={{project_id}}"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: page
    value: ""
    disabled: true
  - key: project_id
    value: "{{project_id}}"
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this binary_version belongs to.
  - key: binary_id
    value: "{{binary_id}}"
    description: The binary this binary_version belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["versions"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("binary_version_id")) pm.collectionVariables.set("binary_version_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
