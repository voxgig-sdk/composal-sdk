$kind: http-request
id: "2b3e420e-a188-5d77-a3b1-d7fc3a502ee8"
description: |-
  The `list` operation of **github_runner_pool**.

  SDK: `client.GithubRunnerPool().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/github_runner_pools"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this github_runner_pool belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["github_runner_pools"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("github_runner_pool_id")) pm.collectionVariables.set("github_runner_pool_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
