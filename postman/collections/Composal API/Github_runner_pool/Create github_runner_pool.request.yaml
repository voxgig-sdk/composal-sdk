$kind: http-request
id: f96243a0-1aa2-52b2-ad5e-0f3d95b10b7d
description: |-
  The `create` operation of **github_runner_pool**.

  SDK: `client.GithubRunnerPool().create({ organization_id: "example", github_app_installation_id: "example", repository_full_name: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/github_runner_pools"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this github_runner_pool belongs to.
body:
  type: json
  content: |-
    {
      "github_app_installation_id": "{{github_app_installation_id}}",
      "repository_full_name": "example",
      "label": "composal",
      "image": "example",
      "provider": "modal",
      "enabled": true,
      "max_concurrency": 1,
      "timeout_seconds": 1
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body?.["github_runner_pool"]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("github_runner_pool_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 2000
