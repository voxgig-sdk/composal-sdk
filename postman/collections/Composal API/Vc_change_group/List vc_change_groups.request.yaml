$kind: http-request
id: "062a67c2-c306-5d19-b0d7-98f117a4ef09"
description: |-
  The `list` operation of **vc_change_group**.

  SDK: `client.VcChangeGroup().list({ organization_id: "example", repo_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/repos/:repo_slug/vcs/change_groups"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this vc_change_group belongs to.
  - key: repo_slug
    value: "{{repo_id}}"
    description: The repo this vc_change_group belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["groups"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("vc_change_group_id")) pm.collectionVariables.set("vc_change_group_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
