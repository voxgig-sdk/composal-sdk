$kind: http-request
id: eb1901fe-00d9-5235-ac9c-09e86afc5e79
description: |-
  The `list` operation of **secret_grant**.

  SDK: `client.SecretGrant().list({ organization_id: "example", secret_id: "example" })`
url: "{{base}}/api/v1/identity/organizations/:organization_id/secrets/:secret_id/grants"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this secret_grant belongs to.
  - key: secret_id
    value: "{{secret_id}}"
    description: "Input: secret_id."
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("secret_grant_id")) pm.collectionVariables.set("secret_grant_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
