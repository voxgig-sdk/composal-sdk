$kind: http-request
id: "08efd88d-e421-5a67-b3a9-c8c51e919659"
description: |-
  The `remove` operation of **secret_grant**.

  SDK: `client.SecretGrant().remove({ id: "example_id", organization_id: "example", secret_id: "example" })`
url: "{{base}}/api/v1/identity/organizations/:organization_id/secrets/:secret_id/grants/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this secret_grant belongs to.
  - key: secret_id
    value: "{{secret_id}}"
    description: "Input: secret_id."
  - key: id
    value: "{{secret_grant_id}}"
    description: The secret_grant this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("secret_grant_id")
      }
    language: text/javascript
order: 9000
