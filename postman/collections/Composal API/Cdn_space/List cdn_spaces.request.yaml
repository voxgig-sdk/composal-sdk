$kind: http-request
id: dd4ba1fd-9e8c-5d0e-bbf4-fb728940b4e0
description: |-
  The `list` operation of **cdn_space**.

  SDK: `client.CdnSpace().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/cdn_spaces"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this cdn_space belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("cdn_space_id")) pm.collectionVariables.set("cdn_space_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
