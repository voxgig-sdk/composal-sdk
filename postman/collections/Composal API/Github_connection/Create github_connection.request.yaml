$kind: http-request
id: "8dda744e-718b-54d8-8aae-b0a41c756f0c"
description: |-
  The `create` operation of **github_connection**.

  SDK: `client.GithubConnection().create({ organization_id: "example", github_app_installation_id: "example", repositories: [] })`
url: "{{base}}/api/v1/organizations/:organization_id/verify/github_connections"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this github_connection belongs to.
body:
  type: json
  content: |-
    {
      "github_app_installation_id": "example",
      "repositories": [
        {
          "owner": "example",
          "name": "example"
        }
      ],
      "project_id": "{{project_id}}",
      "replace": true
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("github_connection_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 2000
