$kind: http-request
id: ac9e114e-8b4f-5fcf-b276-435b5d8b781d
description: |-
  The `create` operation of **pull_request**.

  SDK: `client.PullRequest().create({ organization_id: "example", idempotency_key: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/verify/pull_requests"
method: POST
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this pull_request belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("pull_request_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 2000
