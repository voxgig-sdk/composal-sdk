$kind: http-request
id: "88748c74-c25d-567f-a47f-a7501a02fb0a"
description: |-
  The `list` operation of **domain_path_rule**.

  SDK: `client.DomainPathRule().list({ app_id: "example", domain_id: "example" })`
url: "{{base}}/api/v1/hosting/apps/:app_id/domains/:domain_id/path_rules"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: app_id
    value: "{{app_id}}"
    description: The app this domain_path_rule belongs to.
  - key: domain_id
    value: "{{domain_id}}"
    description: "Input: domain_id."
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["path_rules"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("domain_path_rule_id")) pm.collectionVariables.set("domain_path_rule_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
