description: |-
  The `create` operation of **agent_skill**.

  SDK: `client.AgentSkill().create({ agent_id: "example", organization_id: "example", enabled: true, name: "example", version: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/skills"
