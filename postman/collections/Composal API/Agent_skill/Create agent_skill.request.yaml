$kind: http-request
id: fb84d234-997a-56ac-a846-337e2055e198
description: |-
  The `create` operation of **agent_skill**.

  SDK: `client.AgentSkill().create({ organization_id: "example", audience: {}, revision: "example", skills: [] })`
url: "{{base}}/api/v1/organizations/:organization_id/agent_skills"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_skill belongs to.
body:
  type: json
  content: |-
    {
      "source": "example",
      "marketplace": "skills_sh",
      "plugin": "example",
      "revision": "example",
      "skills": [
        "example"
      ],
      "audience": {
        "mode": "all",
        "agent_ids": [
          "example"
        ],
        "new_agents": true
      }
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("agent_skill_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
