$kind: http-request
id: "0fb470fa-e1b5-5b92-8fad-2807a9d2371c"
description: |-
  The `remove` operation of **agent_skill**.

  SDK: `client.AgentSkill().remove({ id: "example_id", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agent_skills/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_skill belongs to.
  - key: id
    value: "{{agent_skill_id}}"
    description: The agent_skill this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("agent_skill_id")
      }
    language: text/javascript
order: 7000
