$kind: http-request
id: e463af1a-004f-5e46-8df9-8538ab7af39a
description: |-
  The `list` operation of **agent_skill**.

  SDK: `client.AgentSkill().list({ agent_id: "example", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/skills"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_skill belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this agent_skill belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["skills"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("agent_skill_id")) pm.collectionVariables.set("agent_skill_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
