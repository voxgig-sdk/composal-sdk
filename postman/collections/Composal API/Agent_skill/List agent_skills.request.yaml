$kind: http-request
id: "17f90c69-d287-57dd-a65d-1a0c39c6f012"
description: |-
  The `list` operation of **agent_skill**.

  SDK: `client.AgentSkill().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agent_skills"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_skill belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("agent_skill_id")) pm.collectionVariables.set("agent_skill_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
