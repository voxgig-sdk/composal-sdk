$kind: http-request
id: ffd705e6-d1fa-59f9-8b13-8608a7285579
description: |-
  The `create` operation of **project_environment**.

  SDK: `client.ProjectEnvironment().create({ organization_id: "example", project_id: "example", name: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/verification/projects/:project_id/environments"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this project_environment belongs to.
  - key: project_id
    value: "{{project_id}}"
    description: The project this project_environment belongs to.
body:
  type: json
  content: |-
    {
      "desktop": {
        "platform": "linux",
        "provider": "blaxel",
        "artifact_paths": []
      },
      "name": "example",
      "kind": "production",
      "base_url": "https://example.com",
      "allowed_origins": [
        "https://example.com"
      ],
      "allowed_actions": "read_only",
      "binary": "example",
      "imessage_number": "example",
      "messaging_tester_number": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("project_environment_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
