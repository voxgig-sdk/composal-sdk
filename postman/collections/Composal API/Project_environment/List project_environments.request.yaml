$kind: http-request
id: "4e06e774-622b-519d-b19a-b825052b107b"
description: |-
  The `list` operation of **project_environment**.

  SDK: `client.ProjectEnvironment().list({ organization_id: "example", project_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/verification/projects/:project_id/environments"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this project_environment belongs to.
  - key: project_id
    value: "{{project_id}}"
    description: The project this project_environment belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["environments"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("project_environment_id")) pm.collectionVariables.set("project_environment_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
