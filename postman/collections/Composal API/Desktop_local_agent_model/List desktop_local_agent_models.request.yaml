$kind: http-request
id: "1e0bd431-4fdf-5d8d-84d2-c3df493e646c"
description: |-
  The `list` operation of **desktop_local_agent_model**.

  SDK: `client.DesktopLocalAgentModel().list({ organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/desktop_local_agent/models"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this desktop_local_agent_model belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["models"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("desktop_local_agent_model_id")) pm.collectionVariables.set("desktop_local_agent_model_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
