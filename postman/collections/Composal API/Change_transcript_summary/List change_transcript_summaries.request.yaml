$kind: http-request
id: ab8df31b-83ac-536a-8dbd-e547e5cd4fc0
description: |-
  The `list` operation of **change_transcript_summary**.

  SDK: `client.ChangeTranscriptSummary().list({ organization_id: "example", ids: "example" })`
url: "{{base}}/api/v1/organizations/:org_slug/changes/transcript_summaries?ids={{ids}}"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: ids
    value: "{{ids}}"
pathVariables:
  - key: org_slug
    value: "{{organization_id}}"
    description: The organization this change_transcript_summary belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["summaries"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("change_transcript_summary_id")) pm.collectionVariables.set("change_transcript_summary_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
