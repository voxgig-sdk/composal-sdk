$kind: http-request
id: f0c9fe60-18f6-56b5-b3c1-18d0baaa96aa
description: |-
  The `list` operation of **device_browser_operation**.

  SDK: `client.DeviceBrowserOperation().list({ device_id: "example", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/devices/:device_registration_id/browser_operations"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this device_browser_operation belongs to.
  - key: device_registration_id
    value: "{{device_id}}"
    description: The device this device_browser_operation belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["operations"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("device_browser_operation_id")) pm.collectionVariables.set("device_browser_operation_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
