$kind: http-request
id: f0768f7a-9549-57cd-bfee-49f2aadd8de2
description: |-
  The `list` operation of **device_grant**.

  SDK: `client.DeviceGrant().list({ device_id: "example", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/devices/:device_registration_id/grants"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: cursor
    value: ""
    disabled: true
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this device_grant belongs to.
  - key: device_registration_id
    value: "{{device_id}}"
    description: The device this device_grant belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["active_grants"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("device_grant_id")) pm.collectionVariables.set("device_grant_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
