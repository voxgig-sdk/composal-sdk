$kind: http-request
id: fd26f7de-6752-5837-9d75-94a55b2ccd81
description: |-
  The `list` operation of **agent_tool**.

  SDK: `client.AgentTool().list({ agent_id: "example", organization_id: "example" })`
url: "{{base}}/api/v1/organizations/:organization_id/agents/:id/spark/relay/tools"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: organization_id
    value: "{{organization_id}}"
    description: The organization this agent_tool belongs to.
  - key: id
    value: "{{agent_id}}"
    description: The agent this agent_tool belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body?.["tools"] || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("agent_tool_id")) pm.collectionVariables.set("agent_tool_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
